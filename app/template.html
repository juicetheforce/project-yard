<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project yard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
/* Design: docs/design/v3/ (Nocturne tokens, Project yard v3 handoff). Dark only. */
:root{
  color-scheme:dark;
  --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
  --color-rule:color-mix(in srgb,#e9e9ed 8%,transparent);
  --color-neutral-100:#f3f5fe; --color-neutral-300:#cfd3e5; --color-neutral-400:#b2b6ca; --color-neutral-500:#9397ab;
  --color-neutral-600:#75798c; --color-neutral-700:#595d6c; --color-neutral-800:#3f424d; --color-neutral-900:#292b31;
  --color-accent-100:#f5f4ff; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd; --color-accent-400:#b5abfc; --color-accent-500:#968ae0;
  --color-accent-600:#796cbf; --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;
  --color-error:oklch(0.74 0.13 25); --color-warn:oklch(0.8 0.1 80);
  --font-heading:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius-sm:4px; --radius-md:8px;
  --shadow-sm:0 0 0 1px #3f424d;
  --shadow-md:0 0 0 1px #595d6c,0 6px 18px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:14px/1.45 var(--font-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--color-accent);text-underline-offset:3px;transition:color .15s}
a:hover{color:var(--color-accent-400)}
button,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
h1{font-family:var(--font-heading);font-weight:500;letter-spacing:-0.015em;line-height:1.12}
.head{font-family:var(--font-heading);font-weight:500}
.muted{color:var(--color-neutral-500)}
.faint{color:var(--color-neutral-600)}
.error{color:var(--color-error)}
.warn{color:var(--color-warn)}
.nostage{color:var(--color-accent-300)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Nocturne components */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-100)}
.tag-outline{border:1px solid var(--color-neutral-700);color:var(--color-neutral-400)}
.tag.sm{font-size:10px;padding:1px 7px}
.tag-outline.sm{padding:0 7px;border-color:var(--color-neutral-600)}
.btn{cursor:pointer;font-size:14px;line-height:1.2;background:transparent;border:1px solid transparent;border-radius:var(--radius-md);padding:8px 14px;transition:background .15s}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.input{min-height:30px;padding:3px 8px;font-size:12.5px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);transition:border-color .15s}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
select.input option{background:var(--color-surface)}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-sm)}
.seg button{background:none;border:0;padding:3px 9px;font-size:11.5px;cursor:pointer;transition:background .15s}
.seg button+button{border-left:1px solid var(--color-divider)}
.seg button[aria-pressed=true]{color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.seg button:not([aria-pressed=true]):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}

.dot{border-radius:50%;flex:none;display:inline-block}
.focusdot{width:6px;height:6px;background:var(--color-accent);box-shadow:0 0 6px var(--color-accent)}
/* Rules fade out at both ends: 48px on the page, 24px in compact, 32px inside panels. */
.rule{background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.rule:hover{background:linear-gradient(var(--color-surface),var(--color-surface)) no-repeat 0 0/100% 100%,linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.c-row.rule{background:linear-gradient(to right,transparent,var(--color-divider) 24px,var(--color-divider) calc(100% - 24px),transparent) no-repeat bottom/100% 1px}
.c-row.rule:hover{background:linear-gradient(var(--color-surface),var(--color-surface)) no-repeat 0 0/100% 100%,linear-gradient(to right,transparent,var(--color-divider) 24px,var(--color-divider) calc(100% - 24px),transparent) no-repeat bottom/100% 1px}
.panel .rule,.panel .rule:hover{background:linear-gradient(to right,transparent,var(--color-rule) 32px,var(--color-rule) calc(100% - 32px),transparent) no-repeat bottom/100% 1px}
.dim{opacity:.5}

/* stage pipeline: md (overview rows), sm (compact) */
.rail{display:flex;align-items:center}
.rail .step{display:flex;align-items:center}
.rail .step+.step{flex:1}
.rail .conn{flex:1;height:1px}
.node{border-radius:50%;flex:none;border-width:1.5px}
.rail.md{height:10px}.rail.md .node{width:10px;height:10px}
.rail.sm{height:8px}.rail.sm .node{width:7px;height:7px;border-width:1px}
.node.done{background:var(--color-neutral-500);border-style:solid;border-color:var(--color-neutral-500)}
.node.now{background:var(--color-accent);border-style:solid;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-900),0 0 10px var(--color-accent-600)}
.rail.sm .node.now{box-shadow:0 0 0 2px var(--color-accent-900),0 0 6px var(--color-accent-600)}
.node.todo{border-style:solid;border-color:var(--color-neutral-700)}
.node.none{border-style:dashed;border-color:var(--color-accent-600)}
.node.bad{border-style:dotted;border-color:var(--color-error)}
.conn.done{background:var(--color-neutral-500)}
.conn.todo,.conn.bad{background:var(--color-neutral-800)}
.conn.none{background:var(--color-accent-900)}

.bars{display:flex;align-items:flex-end;gap:2px}
.bars span{flex:1;border-radius:1px;background:var(--color-neutral-800)}
.bars .on{background:var(--color-neutral-500)}
.bars .old.on{background:var(--color-neutral-700)}
.bars .recent.on{background:var(--color-neutral-400)}
.bars .hot.on{background:var(--color-accent-500)}
.bars .unknown{background:repeating-linear-gradient(to right,var(--color-neutral-800) 0 2px,transparent 2px 4px)}

/* ---------------------------------------------------------------- overview */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px 24px 6px}
.brand{font-family:var(--font-heading);font-weight:500;font-size:17px;margin-right:auto;letter-spacing:-0.01em}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px;color:var(--color-neutral-500)}
.sources .src{display:inline-flex;align-items:center;gap:6px}
.sources .dot{width:6px;height:6px;background:var(--color-neutral-400)}
.sources .dot.bad{background:var(--color-error)}
.gear{display:inline-flex;align-items:center;gap:6px;color:var(--color-neutral-400);text-decoration:none;font-size:12px;padding:4px 6px;border-radius:var(--radius-md);transition:background .15s,color .15s}
.gear:hover{color:var(--color-text);background:var(--color-surface)}
.gear svg{width:16px;height:16px}
.bannerwrap{padding:8px 24px 0}
.banner{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:8px 12px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm);font-size:13px;max-width:1200px}
.banner .rest{color:var(--color-neutral-400)}

.strip{padding:20px 24px 4px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.strip .sep{width:1px;height:38px;background:var(--color-neutral-800);align-self:flex-end;margin-bottom:4px}
.cell{cursor:pointer;text-align:left;background:transparent;border:0;border-radius:var(--radius-md);padding:6px 12px 7px;min-width:64px;display:flex;flex-direction:column;gap:5px;transition:background .15s}
.cell:hover{background:var(--color-surface)}
.cell .n{font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1}
.cell.big .n{font-size:30px}
.cell .l{font-size:11px;line-height:1.2;color:var(--color-neutral-500)}
.cell.zero .n{color:var(--color-neutral-600)}
.cell[aria-pressed=true],.cell[aria-pressed=true]:hover{background:var(--color-accent-900);box-shadow:inset 0 0 0 1px var(--color-accent-700)}
.cell[aria-pressed=true] .n{color:var(--color-accent-200)}
.cell[aria-pressed=true] .l{color:var(--color-accent-300)}

.controls{padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:1600px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .sep{width:1px;height:18px;margin:0 4px;background:var(--color-neutral-800)}
.chip{font-size:12.5px;line-height:1;padding:6px 10px;border-radius:var(--radius-md);cursor:pointer;background:transparent;color:var(--color-neutral-400);border:1px solid var(--color-neutral-800);display:inline-flex;gap:6px;align-items:center;transition:border-color .15s}
.chip:hover{border-color:var(--color-neutral-500)}
.chip span{opacity:.55;font-size:11px}
.chip[aria-pressed=true]{background:var(--color-accent-900);color:var(--color-accent-200);border-color:var(--color-accent-700)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-500)}

.list{padding:0 24px 48px;display:flex;flex-direction:column}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:16px 10px 4px;display:flex;align-items:center;gap:8px;color:var(--color-neutral-500)}
.group::before{content:"";width:14px;height:1px;background:currentColor}
.group.focus{color:var(--color-accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 28px;padding:11px 10px 12px;color:inherit;text-decoration:none;border-radius:var(--radius-md)}
.row:hover{color:inherit}
.row .who{flex:1 1 240px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.row .name{font-family:var(--font-heading);font-weight:500;font-size:15px;color:var(--color-text)}
.row .priv{font-size:10.5px;color:var(--color-neutral-600);letter-spacing:.04em}
.row .summary{font-size:12.5px;color:var(--color-neutral-400)}
.row .meta{font-size:12px;color:var(--color-neutral-500);display:flex;gap:4px 10px;flex-wrap:wrap}
.row .next{flex:2 1 280px;max-width:640px;min-width:0;padding-top:1px}
.row .next .k{font-size:11px;color:var(--color-neutral-600);line-height:1.3;margin-bottom:2px}
.row .next .v{font-size:14px;line-height:1.35;text-wrap:pretty}
.row .stage{flex:0 0 180px;display:flex;flex-direction:column;gap:7px;padding-top:7px}
.row .stage .lbl{font-size:12px;display:flex;justify-content:space-between;gap:8px;line-height:1.2}
.row .stage .sub{color:var(--color-neutral-600);font-size:11px;white-space:nowrap}
.row .spark{flex:0 0 90px;display:flex;flex-direction:column;gap:5px;padding-top:3px}
.row .spark .bars{height:22px}
.row .spark .cap{font-size:11px;color:var(--color-neutral-500);line-height:1.2}
.row .last{flex:1 1 190px;max-width:280px;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:3px;font-size:12px;line-height:1.35}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv>:first-child{color:var(--color-neutral-500)}
.kv>:last-child{color:var(--color-neutral-300)}
.kv>.warn:last-child{color:var(--color-warn)}
.row .issues{display:none;flex:2 1 320px;max-width:720px;min-width:0;flex-direction:column;gap:3px;padding-top:3px;font-size:12px;line-height:1.35}
.row .issues .i{display:flex;gap:10px;min-width:0}
@media (min-width:2400px){.row .issues{display:flex}}
.empty{padding:56px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.empty .h{font-family:var(--font-heading);font-weight:500;font-size:17px}

/* ---------------------------------------------------------------- compact (panel popup, ~420px) */
.c-top{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.c-top .brand{font-size:14px;letter-spacing:0}
.c-err{margin:0 12px 6px;padding:5px 9px;border-radius:var(--radius-sm);background:var(--color-surface);font-size:11.5px;color:var(--color-error)}
.c-list{padding:0 6px 8px;display:flex;flex-direction:column}
.c-list .group{font-size:10px;padding:8px 6px 3px;gap:6px}
.c-list .group::before{width:10px}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 42px;gap:2px 10px;align-items:center;padding:6px 6px 7px;border-radius:var(--radius-sm);color:inherit;text-decoration:none}
.c-row:hover{color:inherit}
.c-row .l1{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.3}
.c-row .focusdot{width:5px;height:5px;box-shadow:0 0 5px var(--color-accent)}
.c-row .name{font-family:var(--font-heading);font-weight:500;font-size:13px}
.c-row .st{font-size:11px;white-space:nowrap}
.c-row .ago{font-size:11px;text-align:right}
.c-row .l2{grid-column:1/-1;display:flex;gap:8px;min-width:0;font-size:12px;line-height:1.3}

/* ---------------------------------------------------------------- detail */
.detail{max-width:1600px;padding:14px 24px 56px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;padding:4px 6px 4px 0;border-radius:var(--radius-sm)}
.d-head{margin-top:20px;display:flex;flex-wrap:wrap;gap:14px 40px;align-items:flex-start}
.d-id{flex:1 1 340px;min-width:0}
.d-id .title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-id h1{font-size:30px;margin:0}
.d-id .focusdot{width:8px;height:8px;box-shadow:0 0 8px var(--color-accent)}
.d-id p{font-size:15px;color:var(--color-neutral-300);margin:8px 0;max-width:64ch;text-wrap:pretty}
.d-id .links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.d-id .links a{text-decoration:none}
.stats{flex:0 1 480px;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px}
.stats dt{font-size:11px;color:var(--color-neutral-500)}
.stats dd{margin:2px 0 0;font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1.1;white-space:nowrap}
/* Three independent rows: a long panel never stretches its neighbours. */
.drows{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1100px){
  .drow.a{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,3fr) minmax(0,3fr)}
  .drow.c{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)}
}
.panel{background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph .t{font-family:var(--font-heading);font-weight:500;font-size:15px}
.panel .ph .c{margin-left:auto;font-size:12px;color:var(--color-neutral-500)}
.panel .none{font-size:13px;color:var(--color-neutral-600)}
.stagepanel{gap:18px}
.stagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.stagehead .big{font-family:var(--font-heading);font-weight:500;font-size:20px}
.stagehead .why{font-size:12.5px;color:var(--color-neutral-500)}
.stagehead .why.alt{color:var(--color-neutral-400)}
.stagehead .mono{font-family:ui-monospace,monospace}
.bigrail{position:relative;display:flex;padding-top:2px}
.bigrail .line{position:absolute;left:calc(100%/12);right:calc(100%/12);top:8.5px;height:1px}
.bigrail .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.bigrail .node{position:relative;width:14px;height:14px;border-width:1.5px}
.bigrail .node.todo,.bigrail .node.none,.bigrail .node.bad{background:var(--color-surface)}
.bigrail .lab{font-size:11.5px;color:var(--color-neutral-600);max-width:100%}
.bigrail .lab.done{color:var(--color-neutral-400)}
.bigrail .lab.now{color:var(--color-text)}
.nextblock{padding-top:14px;background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat top/100% 1px}
.kicker{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:6px}
.nextbig{font-size:17px;line-height:1.35;text-wrap:pretty}
.activity .bars{height:64px}
.axis{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--color-neutral-600);flex-wrap:wrap}
.axis .mid{color:var(--color-neutral-400)}
.repo dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;font-size:13px}
.repo dt{color:var(--color-neutral-500)}
.repo dd{margin:0;min-width:0}
.repo dd a.plain{color:var(--color-text);text-decoration:none}
.repo .sub{color:var(--color-neutral-500);font-size:12px}
.lines{list-style:none;margin:0;padding:0 6px 0 0;display:flex;flex-direction:column;overflow-y:auto}
.lines li{display:flex;gap:14px;align-items:baseline;padding:6px 0;font-size:13px;background:linear-gradient(to right,transparent,var(--color-rule) 32px,var(--color-rule) calc(100% - 32px),transparent) no-repeat bottom/100% 1px}
.lines a{color:var(--color-text);text-decoration:none}
.lines a:hover{color:var(--color-accent-400)}
.lines .n{flex:none;margin-left:auto;color:var(--color-neutral-300);font-size:12px;white-space:nowrap}
.lines .n .faint{margin-left:6px}
.rel-latest{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rel-latest .tagname{font-family:var(--font-heading);font-weight:500;font-size:17px;color:var(--color-text);text-decoration:none}
.rel-latest .when{font-size:12px;color:var(--color-neutral-500)}
.rel-latest .tot{margin-left:auto;font-size:12px;color:var(--color-neutral-300)}
.assets{max-height:204px}
.assets li{display:block}
.assets .a{display:flex;gap:10px;align-items:baseline;min-width:0}
.assets .a a{flex:1;min-width:0;display:flex;gap:8px;color:var(--color-accent)}
.assets .a a:hover{color:var(--color-accent-400)}
.assets .size{flex:none;font-size:11px;color:var(--color-neutral-600)}
.assets .cnt{flex:none;width:44px;text-align:right;font-size:12.5px;color:var(--color-text)}
.assets .track{margin:4px 54px 0 18px;height:3px;border-radius:2px;background:var(--color-neutral-800)}
.assets .track i{display:block;height:3px;border-radius:2px;background:var(--color-accent-600)}
.earlier{display:flex;flex-direction:column;gap:4px;font-size:12px}
.earlier .kicker{margin-bottom:0}
.earlier .rows{display:flex;flex-direction:column;gap:4px;max-height:148px;overflow-y:auto;padding-right:6px}
.earlier .o{display:flex;gap:10px;align-items:baseline}
.earlier .o a{text-decoration:none}
.earlier .o .d{color:var(--color-neutral-600)}
.earlier .o .n{margin-left:auto;color:var(--color-neutral-300)}
.notes-cols{column-width:340px;column-gap:40px;column-rule:1px solid var(--color-divider);font-size:13.5px;line-height:1.55;color:var(--color-neutral-300)}
/* Sections flow across columns; only paragraphs and bullets stay whole, and a heading never ends a column. */
.notes-cols .sec{padding-bottom:16px}
.notes-cols .st{break-after:avoid;font-family:var(--font-heading);font-weight:500;font-size:13.5px;color:var(--color-text);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.notes-cols .st::before{content:"";width:10px;height:1px;flex:none;background:var(--color-accent)}
.notes-cols p{margin:0 0 7px;text-wrap:pretty;break-inside:avoid}
.notes-cols ul{margin:0 0 7px;padding-left:18px}
.notes-cols li{text-wrap:pretty;break-inside:avoid}
.notes-cols li+li{margin-top:3px}
.commits{max-height:372px}
.commits .date{flex:none;width:78px;color:var(--color-neutral-500);font-size:12px}
.commits a{flex:1}
.issuelist{max-height:372px}
.issuelist li{flex-wrap:wrap;gap:4px 12px;padding:7px 0}
.issuelist a{flex:1 1 180px;min-width:0}
.issuelist .labels{display:flex;gap:4px;flex-wrap:wrap}
.issuelist .age{flex:none;color:var(--color-neutral-500);font-size:12px;width:40px;text-align:right}
.more{font-size:12px}
.quiet{font-size:12px;color:var(--color-neutral-600)}
.notfound{padding:48px 0}
.notfound .h{font-family:var(--font-heading);font-weight:500;font-size:20px}

/* traffic: total and unique overlaid on one axis (unique ≤ total) */
.tchart{display:flex;flex-direction:column;gap:6px;min-width:0}
.tchart .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px}
.tchart .hd .k{font-weight:500}
.legend{display:inline-flex;gap:12px;font-size:11px;color:var(--color-neutral-500)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbars{display:flex;align-items:stretch;gap:1px;height:64px}
.tbars .d{flex:1;position:relative;min-width:0;border-radius:2px}
.tbars .d:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.tbars .d i{position:absolute;left:0;right:0;bottom:0;border-radius:2px 2px 0 0}
.tbars .d.unknown i{background:repeating-linear-gradient(to right,var(--color-neutral-800) 0 2px,transparent 2px 4px)}
.c-total{background:var(--color-neutral-600)}
.c-unique{background:var(--color-accent-400)}
.totals{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--color-neutral-400)}
.totals b{font-weight:500;color:var(--color-text)}
.toplist{max-height:168px}

/* settings */
.settings{max-width:820px;padding:14px 24px 56px}
.settings h1{font-size:30px;margin:20px 0 8px}
.settings .intro{color:var(--color-neutral-300);font-size:15px;margin:0 0 18px;max-width:64ch;text-wrap:pretty}
.settings .status{font-size:12.5px}
.settings .status:empty{display:none}
.srow{display:flex;align-items:center;gap:12px;padding:9px 0}
.srow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .nm .nmline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow .nm .id{font-size:12px;color:var(--color-neutral-500)}
.srow.off .nm{opacity:.5}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--color-neutral-400);min-width:92px;justify-content:flex-end}
.switch input{appearance:none;margin:0;width:34px;height:20px;border-radius:10px;background:var(--color-neutral-800);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--color-neutral-400);transition:transform .15s}
.switch input:checked{background:var(--color-accent-700)}
.switch input:checked::after{transform:translateX(14px);background:var(--color-accent-200)}
.switch input:disabled{opacity:.5;cursor:wait}

@media (max-width:560px){
  .detail,.settings{padding:10px 12px 32px}
  .d-id h1,.settings h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
let DATA=/*__DATA__*/null;

// ---------------------------------------------------------------- helpers
const STAGE_LABEL={idea:'Idea',scoping:'Scoping',design:'Design',building:'Building',testing:'Testing',live:'Live'};
const STAGE_FILE='.project.toml';
const DAY=864e5;
const COMPACT=matchMedia('(max-width:560px)');
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{return null}};
const ui={filter:ls('yard.filter')||'all',cat:ls('yard.cat')||'all',sort:ls('yard.sort')||'stage',cfilter:ls('yard.cfilter')||'all'};
function setUi(k,v){ui[k]=v;ls('yard.'+k,v);render();}

// Build DOM with text nodes only: commit messages, notes and issue titles are untrusted.
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  return el;
}
// Times are relative to the snapshot's refresh time, not the viewer's clock.
const now=()=>new Date(DATA.generatedAt);
const hoursSince=d=>(now()-new Date(d))/36e5;
const daysSince=d=>d?Math.floor(hoursSince(d)/24):null;
function ago(d){
  if(!d)return '—';const hr=Math.floor(hoursSince(d));
  if(hr<1)return 'just now';if(hr<24)return hr+'h ago';
  const dd=Math.floor(hr/24);if(dd<90)return dd+'d ago';
  const m=Math.floor(dd/30);return m<12?m+'mo ago':Math.floor(dd/365)+'y ago';
}
function short(d){
  if(!d)return '—';const hr=Math.floor(hoursSince(d));
  if(hr<1)return 'now';if(hr<24)return hr+'h';const dd=Math.floor(hr/24);
  return dd<90?dd+'d':dd<730?Math.floor(dd/30)+'mo':Math.floor(dd/365)+'y';
}
const isoDate=d=>d?new Date(d).toISOString().slice(0,10):'—';
const clock=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const when=d=>daysSince(d)<1?clock(d):isoDate(d)+' '+clock(d);
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const fmtN=n=>(n||0).toLocaleString('en-US');
const sentence=s=>/[.!?]$/.test(s)?s:s+'.';
function bytes(n){
  if(n<1024)return n+' B';const u=['KB','MB','GB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return (n<10?n.toFixed(1):Math.round(n))+' '+u[i];
}

// ---------------------------------------------------------------- project model
function enrich(raw){
  // Defaults cover data saved by an older version, rendered before the first refresh.
  const p={stars:0,forks:0,watchers:0,releases:[],releaseCount:0,downloads:0,traffic:null,trafficCollected:false,...raw};
  const idx=DATA.stages.indexOf(p.stage);
  const hasStage=idx>=0, bad=!!p.stageError, noStage=!hasStage&&!bad;
  const last=p.lastCommit, lastDays=last?daysSince(last.date):null;
  const quiet=lastDays!=null&&lastDays>=DATA.staleDays&&!p.archived&&!p.paused;
  const stale=hasStage&&last&&p.stageUpdated&&daysSince(p.stageUpdated)>DATA.staleDays&&new Date(last.date)>new Date(p.stageUpdated);
  // One flag per row, first match wins (handoff order).
  let flag=null,flagClass='muted';
  if(bad){flag='Invalid stage file';flagClass='error';}
  else if(noStage){flag='No stage file';flagClass='nostage';}
  else if(p.archived)flag='Archived';
  else if(p.paused)flag='Paused';
  else if(!last){flag='No commits yet';flagClass='warn';}
  else if(quiet){flag='Quiet · '+lastDays+'d';flagClass='warn';}
  else if(stale){flag='Stage may be out of date';flagClass='warn';}
  const stageLabel=hasStage?STAGE_LABEL[p.stage]:noStage?'No stage file':'Invalid stage';
  return {...p,idx,hasStage,bad,noStage,lastDays,quiet,stale,flag,flagClass,stageLabel,
    stageClass:hasStage?'':noStage?'nostage':'error',
    stageSub:hasStage?(p.stageUpdated?'changed '+ago(p.stageUpdated):''):noStage?'to do':'see file',
    nextText:p.next||(noStage?'Set in the stage file':'No next step'),
    lastWarn:quiet||!last,
    dim:p.paused||p.archived,
    aria:p.name+', '+stageLabel+(flag?', '+flag:'')+', next: '+(p.next||'none'),
    href:'#/'+p.id};
}
// Hidden repos (settings screen) stay off the board; their detail pages still work.
const projects=(withHidden=false)=>DATA.projects.filter(p=>withHidden||!p.hidden).map(enrich);

function railSteps(p){
  return DATA.stages.map((s,i)=>{
    const st=p.hasStage?(i<p.idx?'done':i===p.idx?'now':'todo'):p.bad?'bad':'none';
    const conn=p.hasStage?(i<=p.idx?'done':'todo'):st;
    return {label:STAGE_LABEL[s],st,conn};
  });
}
const stageAria=p=>p.stageLabel+(p.hasStage?', stage '+(p.idx+1)+' of 6':'');
function rail(p,size){
  return h('div',{class:'rail '+size,role:'img','aria-label':stageAria(p)},
    railSteps(p).map((s,i)=>h('span',{class:'step'},i?h('span',{class:'conn '+s.conn}):null,h('span',{class:'node '+s.st,title:s.label}))));
}
// Weekly commit bars, oldest first. The current week is accent; `recentFrom` brightens the
// last weeks on the detail chart. null = not fetched yet.
function bars(counts,height,opts={}){
  const known=counts.filter(c=>c!=null),mx=Math.max(1,...known),n=counts.length;
  return h('div',{class:'bars',role:'img','aria-label':opts.aria,style:'height:'+height+'px'},
    counts.map((c,i)=>{
      if(c==null)return h('span',{class:'unknown',style:'height:2px',title:opts.titles?opts.titles[i]+': not fetched yet':null});
      const cls=[c?'on':'',i===n-1?'hot':'',opts.recentFrom!=null?(i>=opts.recentFrom?'recent':'old'):''].join(' ');
      return h('span',{class:cls,style:'height:'+(c?Math.max(3,Math.round(c/mx*height)):2)+'px',title:opts.titles?plural(c,'commit')+', week of '+opts.titles[i]:null});
    }));
}

// ---------------------------------------------------------------- overview
const STRIP_FILTERS={all:()=>true,focus:p=>p.focus,paused:p=>p.paused,nostage:p=>p.noStage,invalid:p=>p.bad};
const matchFilter=(p,f)=>f.startsWith('stage:')?p.stage===f.slice(6):(STRIP_FILTERS[f]||STRIP_FILTERS.all)(p);
const catOf=p=>p.category||'Uncategorised';
const matchCat=(p,c)=>c==='all'||catOf(p)===c;
const lastTime=p=>p.lastCommit?+new Date(p.lastCommit.date):0;
const SORTS={
  stage:(a,b)=>(b.idx-a.idx)||a.name.localeCompare(b.name),
  recent:(a,b)=>lastTime(b)-lastTime(a),
  quiet:(a,b)=>lastTime(a)-lastTime(b),
  name:(a,b)=>a.name.localeCompare(b.name),
};
const sorted=(list,key)=>list.sort(SORTS[key]);
function groupsOf(list,filter){
  if(filter==='focus'||!list.some(p=>p.focus))return [{label:null,items:list}];
  return [{label:'Focus',cls:'focus',items:list.filter(p=>p.focus)},{label:'Everything else',items:list.filter(p=>!p.focus)}];
}

const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
function gear(){
  const n=DATA.projects.filter(p=>p.hidden).length;
  const a=h('a',{href:'#/settings',class:'gear',title:'Settings: show or hide repos','aria-label':'Settings'+(n?', '+n+' hidden':'')},n?plural(n,'hidden repo'):null);
  a.insertAdjacentHTML('afterbegin',GEAR);  // constant markup, no data in it
  return a;
}
function sourcesLine(){
  return h('div',{class:'sources'},
    DATA.sources.map(s=>h('span',{class:'src',title:s.error?s.error:'ok · '+plural(s.count,'repo')},h('span',{class:'dot'+(s.error?' bad':'')}),s.owner)),
    h('span',{class:'faint'},'Refreshed '+clock(DATA.generatedAt)+' · every '+DATA.refreshMinutes+' min'));
}
function banner(){
  const bad=DATA.sources.filter(s=>s.error);
  if(!bad.length)return null;
  return h('div',{class:'bannerwrap'},h('div',{class:'banner',role:'status'},bad.map(s=>h('span',null,
    h('span',{class:'error'},s.owner+': '+sentence(s.error)),' ',
    h('span',{class:'rest'},s.fetchedAt?'Showing its last good data from '+when(s.fetchedAt)+'. The page will recover on the next successful refresh.':'No data from this source yet.')))));
}

function overview(){
  const all=projects(),{filter,cat,sort}=ui;
  const count=key=>all.filter(p=>matchFilter(p,key)&&matchCat(p,cat)).length;
  const cell=(key,label,cls='')=>{const n=count(key),on=filter===key;
    return h('button',{type:'button',class:'cell '+cls+(n?'':' zero'),'aria-pressed':String(on),onclick:()=>setUi('filter',on&&key!=='all'?'all':key)},
      h('span',{class:'n '+(n&&!on?({nostage:'nostage',invalid:'error'}[key]||''):''),style:n&&!on&&key==='paused'?'color:var(--color-neutral-400)':null},n),h('span',{class:'l'},label));};
  const sep=()=>h('span',{class:'sep','aria-hidden':'true'});
  const strip=h('section',{class:'strip',role:'group','aria-label':'Summary and stage filter'},
    cell('all','projects','big'),cell('focus','Focus'),sep(),
    DATA.stages.map(s=>cell('stage:'+s,STAGE_LABEL[s])),sep(),
    cell('paused','Paused'),cell('nostage','No stage file'),cell('invalid','Invalid stage'));

  const cats=[...new Set(all.map(catOf))].sort();
  const chip=(key,label)=>{const on=cat===key;
    return h('button',{type:'button',class:'chip','aria-pressed':String(on),onclick:()=>setUi('cat',key)},label,h('span',null,all.filter(p=>matchFilter(p,filter)&&matchCat(p,key)).length));};
  const sel=h('select',{class:'input',onchange:e=>setUi('sort',e.target.value)},
    [['stage','Furthest along'],['recent','Most recent commit'],['quiet','Quietest first'],['name','Name']].map(([v,l])=>h('option',{value:v,selected:sort===v},l)));
  const controls=h('section',{class:'controls','aria-label':'Category filter and sort'},
    h('div',{class:'chips',role:'group','aria-label':'Category'},chip('all','All categories'),sep(),cats.map(c=>chip(c,c))),
    h('label',{class:'sort'},'Sort',sel));

  const list=sorted(all.filter(p=>matchFilter(p,filter)&&matchCat(p,cat)),sort);
  const main=h('main',{class:'list'});
  for(const g of groupsOf(list,filter)){
    if(!g.items.length)continue;
    if(g.label)main.append(h('div',{class:'group '+(g.cls||'')},g.label));
    main.append(...g.items.map(row));
  }
  if(!list.length){
    const labels=[filter!=='all'?(filter.startsWith('stage:')?STAGE_LABEL[filter.slice(6)]:{focus:'Focus',paused:'Paused',nostage:'No stage file',invalid:'Invalid stage'}[filter]):null,cat!=='all'?cat:null].filter(Boolean);
    main.append(h('div',{class:'empty'},h('div',{class:'h'},'No projects match'),
      h('div',{class:'muted',style:'font-size:13px'},'No project matches '+(labels.join(' in ')||'this filter')+'.'),
      h('button',{type:'button',class:'btn btn-primary',onclick:()=>{ui.cat='all';ls('yard.cat','all');setUi('filter','all');}},'Show all projects')));
  }
  return [h('header',{class:'top'},h('div',{class:'brand'},'Project yard'),sourcesLine(),gear()),banner(),strip,controls,main];
}

function row(p){
  const sparkTotal=p.weekly.reduce((a,b)=>a+b,0);
  return h('a',{href:p.href,class:'row rule'+(p.dim?' dim':''),'aria-label':p.aria},
    h('div',{class:'who'},
      h('div',{class:'title'},p.focus?h('span',{class:'dot focusdot',title:'Focus'}):null,h('span',{class:'name'},p.name),
        p.private?h('span',{class:'priv'},'private'):null,
        p.archived?h('span',{class:'tag tag-neutral sm'},'archived'):null,
        p.paused?h('span',{class:'tag tag-outline sm'},'paused'):null),
      p.summary?h('div',{class:'summary'},p.summary):null,
      h('div',{class:'meta'},p.category?h('span',null,p.category):null,p.flag?h('span',{class:p.flagClass},p.flag):null)),
    h('div',{class:'next'},h('div',{class:'k'},'Next'),h('div',{class:'v'+(p.next?'':' faint')},p.nextText)),
    h('div',{class:'stage'},rail(p,'md'),h('div',{class:'lbl'},h('span',{class:p.stageClass},p.stageLabel),h('span',{class:'sub'},p.stageSub))),
    h('div',{class:'spark'},bars(p.weekly,22,{aria:sparkTotal+' commits over the last 12 weeks'}),h('div',{class:'cap'},sparkTotal+' commits · 12w')),
    h('div',{class:'last'},
      h('div',{class:'kv'},h('span',null,'Last commit'),h('span',{class:p.lastWarn?'warn':null},p.lastCommit?ago(p.lastCommit.date):'none')),
      h('div',{class:'ell',style:'color:var(--color-neutral-400)'},p.lastCommit?p.lastCommit.message:'No commits yet'),
      h('div',{class:'kv'},h('span',null,'Open issues'),h('span',null,p.openIssues)),
      trafficKv(p)),
    h('div',{class:'issues'},h('div',{class:'muted'},p.issues.length?'Open issues':'No open issues'),
      p.issues.slice(0,3).map(i=>h('div',{class:'i'},h('span',{class:'ell',style:'color:var(--color-neutral-300)'},i.title),h('span',{class:'faint',style:'flex:none'},short(i.createdAt))))));
}
// Unique views and clones over GitHub's 14-day window, as of the last daily read.
function trafficKv(p){
  const t=p.traffic;
  if(!p.trafficCollected||!t||!t.last14)return null;
  return h('div',{class:'kv',title:'Unique visitors and cloners over the last 14 days (GitHub traffic)'},h('span',null,'Unique · 14d'),
    h('span',null,t.last14.views.uniques+' views · '+t.last14.clones.uniques+' clones'));
}

// ---------------------------------------------------------------- compact
function compact(){
  const all=projects(),f=ui.cfilter;
  const list=sorted(all.filter(p=>f!=='focus'||p.focus),'stage');
  const bad=DATA.sources.filter(s=>s.error);
  const main=h('main',{class:'c-list'});
  for(const g of groupsOf(list,f)){
    if(!g.items.length)continue;
    if(g.label)main.append(h('div',{class:'group '+(g.cls||'')},g.label));
    main.append(...g.items.map(p=>h('a',{href:p.href,class:'c-row rule'+(p.dim?' dim':''),'aria-label':p.aria},
      h('div',{class:'l1'},p.focus?h('span',{class:'dot focusdot',title:'Focus'}):null,h('span',{class:'name ell'},p.name),h('span',{class:'st '+p.stageClass},p.stageLabel)),
      rail(p,'sm'),
      h('span',{class:'ago '+(p.lastWarn?'warn':'muted')},p.lastCommit?short(p.lastCommit.date):'—'),
      h('div',{class:'l2'},p.flag?h('span',{class:p.flagClass,style:'flex:none'},p.flag):null,h('span',{class:'ell'+(p.next?'':' faint')},p.nextText)))));
  }
  if(!list.length)main.append(h('div',{class:'empty',style:'padding:24px 6px'},h('div',{class:'muted'},f==='focus'?'No focus projects.':'No projects yet.')));
  const seg=h('div',{class:'seg',role:'group','aria-label':'Show'},
    [['all','All'],['focus','Focus']].map(([k,l])=>h('button',{type:'button','aria-pressed':String(f===k),onclick:()=>setUi('cfilter',k)},l)));
  return [h('header',{class:'c-top'},h('div',{class:'brand'},'Project yard'),seg,h('span',{class:'faint',style:'font-size:11px'},clock(DATA.generatedAt))),
    bad.length?h('div',{class:'c-err',role:'status'},bad.map(s=>s.owner+': '+s.error.replace(/\.$/,'')+(s.fetchedAt?' · data from '+when(s.fetchedAt):'')).join(' · ')):null,
    main];
}

// ---------------------------------------------------------------- detail
const panel=(label,cls,...kids)=>h('section',{class:'panel'+(cls?' '+cls:''),'aria-label':label},...kids);
const ph=(title,extra)=>h('div',{class:'ph'},h('span',{class:'t'},title),extra);
const phc=text=>text==null?null:h('span',{class:'c'},text);
function stat(label,value,cls){return h('div',null,h('dt',null,label),h('dd',{class:cls||null},value));}

function detail(id){
  const p=projects(true).find(p=>p.id.toLowerCase()===id.toLowerCase());
  const back=h('a',{href:'#/',class:'back'},'← All projects');
  if(!p)return [h('div',{class:'detail'},back,h('div',{class:'notfound'},h('div',{class:'h'},'No project at this address'),h('div',{class:'muted',style:'margin-top:6px;font-size:13px'},id+" isn't in any connected source.")))];
  document.title=p.name+' · Project yard';
  const t=p.trafficCollected&&p.traffic&&p.traffic.last14?p.traffic.last14:null;

  const head=h('header',{class:'d-head'},
    h('div',{class:'d-id'+(p.dim?' dim':'')},
      h('div',{class:'title'},p.focus?h('span',{class:'dot focusdot',title:'Focus'}):null,h('h1',null,p.name),
        p.category?h('span',{class:'tag tag-neutral'},p.category):null,
        h('span',{class:'tag tag-outline'},p.private?'private':'public'),
        p.archived?h('span',{class:'tag tag-neutral'},'archived'):null,
        p.paused?h('span',{class:'tag tag-outline',style:'border-color:var(--color-neutral-600)'},'paused'):null,
        p.hidden?h('a',{class:'tag tag-outline',href:'#/settings',style:'text-decoration:none'},'hidden'):null),
      p.summary?h('p',null,p.summary):null,
      h('div',{class:'links'},h('a',{href:p.url,target:'_blank',rel:'noopener'},p.id+' ↗'),p.flag?h('span',{class:p.flagClass},p.flag):null)),
    h('dl',{class:'stats'},
      stat('Open issues',p.openIssues),stat('Commits · 12w',p.commits12w),
      stat('Last commit',p.lastCommit?short(p.lastCommit.date):'—',p.lastWarn?'warn':null),
      stat('Stage changed',p.stageUpdated?short(p.stageUpdated):'—'),
      stat('Stars',fmtN(p.stars)),stat('Forks',fmtN(p.forks)),stat('Watchers',fmtN(p.watchers)),
      stat('Downloads',p.releaseCount?fmtN(p.downloads):'—'),
      stat('Views · 14d',t?fmtN(t.views.uniques):'—'),stat('Clones · 14d',t?fmtN(t.clones.uniques):'—')));

  return [h('div',{class:'detail'},back,head,h('div',{class:'drows'},
    h('div',{class:'drow a'},stagePanel(p),activityPanel(p),repoPanel(p),releasesPanel(p)),
    notesPanel(p),
    h('div',{class:'drow c'},commitsPanel(p),issuesPanel(p),trafficPanel(p))))];
}

function stagePanel(p){
  const pct=p.hasStage?p.idx/5*100:0;
  return panel('Stage and next step','stagepanel',
    p.hasStage?h('div',{class:'stagehead'},h('span',{class:'big'},p.stageLabel),
        h('span',{class:'why'},'stage '+(p.idx+1)+' of 6'+(p.stageUpdated?' · changed '+ago(p.stageUpdated)+' ('+isoDate(p.stageUpdated)+')':'')))
      :p.noStage?h('div',{class:'stagehead'},h('span',{class:'big nostage'},'No stage file'),
        h('span',{class:'why alt'},"This repo has no "+STAGE_FILE+" yet, so it can't be placed on the pipeline."))
      :h('div',{class:'stagehead'},h('span',{class:'big error'},'Stage file has an error'),h('span',{class:'why alt mono'},p.stageError)),
    h('div',{class:'bigrail',role:'img','aria-label':stageAria(p)},
      h('div',{class:'line','aria-hidden':'true',style:'background:'+(p.hasStage?'linear-gradient(to right,var(--color-neutral-500) '+pct+'%,var(--color-neutral-800) '+pct+'%)':p.bad?'var(--color-neutral-800)':'var(--color-accent-900)')}),
      railSteps(p).map(s=>h('div',{class:'s'},h('span',{class:'node '+s.st}),h('span',{class:'lab ell '+s.st},s.label)))),
    h('div',{class:'nextblock'},h('div',{class:'kicker'},'Next step'),h('div',{class:'nextbig'+(p.next?'':' faint')},p.nextText)));
}

function activityPanel(p){
  const y=p.year,start=new Date(y.start+'T00:00:00Z');
  const titles=y.weeks.map((_,i)=>new Date(start.getTime()+i*7*DAY).toISOString().slice(0,10));
  const total52=y.weeks.reduce((a,b)=>a+(b||0),0),missing=y.weeks.some(w=>w==null);
  return panel('Commit activity','activity',ph('Commit activity'),
    bars(y.weeks,64,{aria:total52+' commits over 52 weeks',titles,recentFrom:y.weeks.length-12}),
    h('div',{class:'axis'},h('span',null,y.start.slice(0,7)),h('span',{class:'mid'},total52+' commits · 52w · '+p.commits12w+' in the last 12'),h('span',null,'now')),
    missing?h('div',{class:'none'},'Older weeks are still being fetched; they fill in on a later refresh.'):null,
    !p.lastCommit?h('div',{class:'none'},'No commits yet.'):null);
}

function repoPanel(p){
  return panel('Repository','repo',ph('Repository'),
    h('dl',null,
      h('dt',null,'Repo'),h('dd',null,h('a',{href:p.url,target:'_blank',rel:'noopener'},p.id+' ↗')),
      h('dt',null,'Visibility'),h('dd',null,(p.private?'Private':'Public')+(p.archived?' · archived':'')),
      h('dt',null,'Category'),h('dd',null,p.category||'—'),
      h('dt',null,'Last commit'),h('dd',null,p.lastCommit?[h('a',{href:p.lastCommit.url,target:'_blank',rel:'noopener',class:'plain'},p.lastCommit.message),
        h('div',{class:'sub'},isoDate(p.lastCommit.date)+' · '+ago(p.lastCommit.date))]:'—'),
      h('dt',null,'Stage set'),h('dd',null,isoDate(p.stageUpdated))));
}

function releasesPanel(p){
  const [latest,...older]=p.releases;
  const header=ph('Releases',phc(p.releaseCount?fmtN(p.downloads)+' downloads all time':null));
  if(!latest)return panel('Releases',null,header,h('div',{class:'none'},'No releases yet.'));
  // Releases saved by v0.3 have no asset list; they still show the latest tag and its total.
  const assets=latest.assets||[],top=Math.max(1,...assets.map(a=>a.downloads));
  return panel('Releases',null,header,
    h('div',{class:'rel-latest'},
      h('a',{class:'tagname',href:latest.url,target:'_blank',rel:'noopener',title:latest.name},latest.tag),
      latest.prerelease?h('span',{class:'tag tag-outline sm'},'pre-release'):null,
      h('span',{class:'when'},isoDate(latest.publishedAt)+' · '+ago(latest.publishedAt)),
      h('span',{class:'tot'},plural(latest.downloads,'download'))),
    assets.length?h('ul',{class:'lines assets'},assets.map(a=>h('li',null,
      h('div',{class:'a'},h('a',{href:a.url||latest.url},h('span',{'aria-hidden':'true',style:'flex:none'},'↓'),h('span',{class:'ell'},a.name)),
        h('span',{class:'size'},bytes(a.size)),h('span',{class:'cnt'},fmtN(a.downloads))),
      h('div',{class:'track','aria-hidden':'true'},h('i',{style:'width:'+Math.round(a.downloads/top*100)+'%'}))))):null,
    older.length?h('div',{class:'earlier'},h('span',{class:'kicker'},'Earlier'),h('div',{class:'rows'},older.map(r=>h('div',{class:'o'},
      h('a',{href:r.url,target:'_blank',rel:'noopener'},r.tag),h('span',{class:'d'},isoDate(r.publishedAt)),h('span',{class:'n'},fmtN(r.downloads)))))):null,
    p.releaseCount>p.releases.length?h('div',{class:'quiet'},'Counts the newest '+p.releases.length+' of '+p.releaseCount+' releases.'):null);
}

// Notes are markdown-lite: "## " starts a section, "- " a bullet, any other line a paragraph.
function parseNotes(txt){
  const secs=[];let cur=null,list=null;
  const sec=t=>{cur={title:t,blocks:[]};secs.push(cur);list=null;};
  for(const raw of (txt||'').split('\n')){
    const l=raw.trim();
    if(l.startsWith('## ')){sec(l.slice(3));continue;}
    if(!cur)sec('');
    if(!l){list=null;continue;}
    if(l.startsWith('- ')){if(!list){list={items:[]};cur.blocks.push(list);}list.items.push(l.slice(2));continue;}
    list=null;cur.blocks.push({text:l});
  }
  return secs.filter(s=>s.blocks.length);
}
function notesPanel(p){
  const secs=parseNotes(p.notes),titled=secs.filter(s=>s.title).length;
  return panel('Notes',null,ph('Notes',phc((titled>1?titled+' sections · ':'')+STAGE_FILE)),
    secs.length?h('div',{class:'notes-cols'},secs.map(s=>h('div',{class:'sec'},
      s.title?h('div',{class:'st'},s.title):null,
      s.blocks.map(b=>b.items?h('ul',null,b.items.map(i=>h('li',null,i))):h('p',null,b.text)))))
    :h('div',{class:'none'},p.hasStage?'No notes in the stage file.':'Notes come from the stage file.'));
}

function commitsPanel(p){
  return panel('Recent commits',null,ph('Recent commits',phc(p.commits.length?'last '+p.commits.length:null)),
    p.commits.length?h('ol',{class:'lines commits'},p.commits.map(c=>h('li',null,h('span',{class:'date'},isoDate(c.date)),h('a',{href:c.url,target:'_blank',rel:'noopener',class:'ell',title:c.message},c.message))))
      :h('div',{class:'none'},'Nothing pushed yet.'));
}

function issuesPanel(p){
  const more=p.openIssues-p.issues.length;
  return panel('Open issues',null,ph('Open issues',phc(p.openIssues+' open')),
    p.issues.length?h('ul',{class:'lines issuelist'},p.issues.map(i=>h('li',null,
        h('a',{href:i.url,target:'_blank',rel:'noopener'},i.title),
        i.labels.length?h('span',{class:'labels'},i.labels.map(l=>h('span',{class:'tag tag-neutral sm'},l))):null,
        h('span',{class:'age'},short(i.createdAt))))):h('div',{class:'none'},'No open issues.'),
    more>0?h('a',{class:'more',href:p.url+'/issues',target:'_blank',rel:'noopener'},plural(more,'more issue')+' on GitHub ↗'):null);
}

const TRAFFIC_CHART_DAYS=90;
function trafficPanel(p){
  const t=p.traffic;
  if(!p.trafficCollected)return panel('Traffic',null,ph('Traffic'),h('div',{class:'quiet'},"Traffic isn't collected for private repos. Set include_private = true under [traffic] in config.toml to include them."));
  const days=t?Object.keys(t.views).sort():[];
  if(!days.length)return panel('Traffic',null,ph('Traffic'),h('div',{class:'quiet'},t&&t.status==='unavailable'
    ?'Traffic unavailable: the token needs the Administration: Read permission on this repo.'
    :'Traffic is read once a day. It shows up after the next refresh.'));
  // From the first tracked day (at most 90 back) to the latest day GitHub has reported, which
  // trails today by a day or two. Days never returned by a read stay unknown.
  const first=days[0],latest=days[days.length-1];
  const from=new Date(Math.max(Date.parse(first),Date.parse(latest)-(TRAFFIC_CHART_DAYS-1)*DAY));
  const span=[];for(let d=from;d.toISOString().slice(0,10)<=latest;d=new Date(d.getTime()+DAY))span.push(d.toISOString().slice(0,10));
  const sum=(m,k)=>Object.values(t[m]).reduce((a,d)=>a+d[k],0);
  return panel('Traffic',null,ph('Traffic',phc('read '+ago(t.fetchedAt))),
    t.status==='unavailable'?h('div',{class:'quiet'},'Traffic unavailable since the last read (the token needs Administration: Read). Showing what was collected before.'):null,
    trafficChart('Views',t.views,span,'view'),trafficChart('Clones',t.clones,span,'clone'),
    h('div',{class:'totals'},h('span',null,'Since '+first+':'),
      h('span',null,h('b',null,fmtN(sum('views','count'))),' views'),
      h('span',null,h('b',null,fmtN(sum('clones','count'))),' clones'),
      h('span',{class:'faint',title:'Someone who visits on two days counts twice'},'daily uniques summed: '+fmtN(sum('views','uniques'))+' views · '+fmtN(sum('clones','uniques'))+' clones')),
    topList(p,t,'referrers'),topList(p,t,'paths'));
}
function trafficChart(label,byDay,span,unit){
  const vals=span.map(d=>byDay[d]),mx=Math.max(1,...vals.filter(Boolean).map(v=>v.count));
  const last14=span.slice(-14).reduce((a,d)=>a+(byDay[d]?byDay[d].count:0),0);
  return h('div',{class:'tchart'},
    h('div',{class:'hd'},h('span',{class:'k'},label),
      h('span',{class:'legend'},h('span',null,h('i',{class:'c-total'}),'Total'),h('span',null,h('i',{class:'c-unique'}),'Unique'))),
    h('div',{class:'tbars',role:'img','aria-label':label+' per day, '+span[0]+' to '+span[span.length-1]+'. '+last14+' in the last 14 days.'},
      span.map((d,i)=>{const v=vals[i];
        if(!v)return h('span',{class:'d unknown',title:d+': not tracked'},h('i',{style:'height:2px'}));
        const ht=n=>(n?Math.max(2,Math.round(n/mx*64)):0)+'px';
        return h('span',{class:'d',title:d+': '+plural(v.count,unit)+', '+v.uniques+' unique'},
          h('i',{class:'c-total',style:'height:'+ht(v.count)}),h('i',{class:'c-unique',style:'height:'+ht(v.uniques)}));
      })),
    h('div',{class:'axis'},h('span',null,span[0]),h('span',null,'peak '+mx+'/day'),h('span',null,span[span.length-1])));
}
function topList(p,t,kind){
  const title=kind==='referrers'?'Top referrers · 14d':'Popular pages · 14d';
  const items=t[kind]||[],origin=p.url.startsWith('http')?new URL(p.url).origin:'';
  return h('div',null,h('div',{class:'kicker'},title),
    items.length?h('ul',{class:'lines toplist'},items.map(r=>h('li',null,
      kind==='referrers'?h('span',{class:'ell'},r.referrer)
        :h('a',{href:origin+r.path,target:'_blank',rel:'noopener',class:'ell',title:r.title},r.path.replace('/'+p.id,'')||'/'),
      h('span',{class:'n'},r.count,h('span',{class:'faint'},r.uniques+' unique')))))
    :h('div',{class:'none'},kind==='referrers'?'No referrers in the last 14 days.':'No page views in the last 14 days.'));
}

// ---------------------------------------------------------------- settings
let saving=false,saveMsg=null;
function settings(){
  document.title='Settings · Project yard';
  const list=[...DATA.projects].sort((a,b)=>a.id.localeCompare(b.id));
  const status=h('div',{class:'status',role:'status'},saveMsg?h('span',{class:saveMsg.err?'error':'muted'},saveMsg.text):null);
  const rows=list.map(p=>h('div',{class:'srow rule'+(p.hidden?' off':'')},
    h('div',{class:'nm'},h('span',{class:'nmline'},h('span',{class:'head'},p.name),p.private?h('span',{class:'faint',style:'font-size:10.5px;letter-spacing:.04em'},'private'):null,
        p.archived?h('span',{class:'tag tag-neutral sm'},'archived'):null),
      h('span',{class:'id'},p.id)),
    h('label',{class:'switch'},p.hidden?'Hidden':'Shown',
      h('input',{type:'checkbox',role:'switch',checked:!p.hidden,disabled:saving,'aria-label':'Show '+p.id+' on the board',
        onchange:e=>saveHidden(p.id,!e.target.checked)}))));
  return [h('div',{class:'settings'},h('a',{href:'#/',class:'back'},'← All projects'),
    h('h1',null,'Settings'),
    h('p',{class:'intro'},'Every repo the collector finds. Hidden repos drop off the board but stay listed here. New repos are shown. Repos that config.toml leaves out (its exclude list, plus archived repos and forks unless it includes them) never appear here.'),
    panel('Repos',null,ph('Show on the board',phc(plural(list.filter(p=>p.hidden).length,'hidden repo'))),status,
      list.length?h('div',null,rows):h('div',{class:'none'},'No repos yet. They appear after the first refresh.')))];
}
async function saveHidden(id,hide){
  const hidden=new Set(DATA.projects.filter(p=>p.hidden).map(p=>p.id));
  hide?hidden.add(id):hidden.delete(id);
  saving=true;saveMsg=null;render();
  try{
    const r=await fetch('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:[...hidden]})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(body.error||('HTTP '+r.status));
    const saved=new Set(body.hidden.map(s=>s.toLowerCase()));
    for(const p of DATA.projects)p.hidden=saved.has(p.id.toLowerCase());
    saveMsg={text:(hide?'Hid ':'Showing ')+id+'.'};
  }catch(e){saveMsg={err:true,text:"Couldn't save: "+e.message};}
  saving=false;render();
}

// ---------------------------------------------------------------- routing + refresh
function render(){
  const hash=decodeURIComponent(location.hash),m=/^#\/(.+\/.+)$/.exec(hash);
  document.title='Project yard';
  const app=document.getElementById('app');
  app.replaceChildren(...(hash==='#/settings'?settings():m?detail(m[1]):COMPACT.matches?compact():overview()).filter(Boolean));
}
let lastRoute=location.hash;
addEventListener('hashchange',()=>{render();if(location.hash!==lastRoute)scrollTo(0,0);lastRoute=location.hash;});
COMPACT.addEventListener('change',render);
render();

// The server rewrites data.json every refresh; pick it up without reloading the page.
setInterval(async()=>{
  if(document.visibilityState!=='visible'||saving)return;
  try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){DATA=await r.json();render();}}catch{}
},5*60*1000);
</script>
