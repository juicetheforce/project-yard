<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Project yard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
/* ==========================================================================
   Nocturne, inlined from docs/design/v5/source/_ds/…/styles.css.
   The only change: its Google Fonts @import is removed, because the page is
   LAN-only and self-contained. "Inter" is used if installed, else system-ui.
   ========================================================================== */
/* Nocturne — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */

:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to
     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro
     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel
     accent held (L 0.660, so the documented ratios survive) and chroma
     in the product blurple's own range (its token sits at C 0.118; the
     accent takes 0.125, from the old steel's 0.030):
     the accent now reads as an accent rather than another neutral. */
  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same
     hue, same L 0.734, chroma at the same 2:3 proportion it held */
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f3f5fe;
  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  /* Deck section-divider ground — review round 3: saturation as presence.
     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own
     family; C 0.094 — written when the accent held C 0.030, before the
     round-7 blurple raised it past the ground's) with a lighter bloom and
     a ghost tint of the same hue, while the slide grounds stay
     desaturated. Deck-scale fills only — not interface colors. */
  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.lighten{mix-blend-mode:lighten;background-color:transparent}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
/* Rules fade to transparent at both ends instead of stopping cleanly — a
   Nocturne signature. The ramp is 48px an end (one deck baseline unit),
   painted from the same divider token. Freestanding rules fade; box
   outlines, in-control separators, and short accent marks stay solid. */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid transparent;
}
/* Row rules as row-level strips so the end-fade spans the row, not each cell. */
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr {
  background: linear-gradient(to right,
    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr:hover {
  /* the hover tint layers over the row rule, which keeps painting */
  background:
    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),
                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,
    linear-gradient(to right,
      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* ==========================================================================
   Project yard. Layout and states from docs/design/v5/README.md. Dark only.
   ========================================================================== */
:root{
  --color-error:oklch(0.74 0.13 25); --color-warn:oklch(0.8 0.1 80);
  --color-rule:color-mix(in srgb,var(--color-text) 8%,transparent);
}
body{font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:var(--color-neutral-700) transparent}
a{transition:color .15s}
a:hover{color:var(--color-accent-400)}
button,select{font:inherit;color:inherit}
select.input option{background:var(--color-surface)}
h1{margin:0}
p{margin:0}
.head{font-family:var(--font-heading);font-weight:500}
.muted{color:var(--color-neutral-500)}
.faint{color:var(--color-neutral-600)}
.error{color:var(--color-error)}
.warn{color:var(--color-warn)}
.nostage{color:var(--color-accent-300)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mono{font-family:ui-monospace,monospace}
.icon{display:inline-flex;flex:none}
.icon svg{width:1em;height:1em;display:block}
.tag.sm{font-size:10px;padding:1px 7px}
.tag-outline.quiet{border-color:var(--color-neutral-600);color:var(--color-neutral-400)}
.tag-outline.sm{padding:0 7px}
.dot{border-radius:50%;flex:none;display:inline-block}
.focusdot{width:6px;height:6px;background:var(--color-accent);box-shadow:0 0 6px var(--color-accent)}
/* Rules fade out at both ends: 48px on the page, 24px in compact, 32px inside panels. */
.rule{background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.rule:hover{background:linear-gradient(var(--color-surface),var(--color-surface)) no-repeat 0 0/100% 100%,linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.c-row.rule{background:linear-gradient(to right,transparent,var(--color-divider) 24px,var(--color-divider) calc(100% - 24px),transparent) no-repeat bottom/100% 1px}
.c-row.rule:hover{background:linear-gradient(var(--color-surface),var(--color-surface)) no-repeat 0 0/100% 100%,linear-gradient(to right,transparent,var(--color-divider) 24px,var(--color-divider) calc(100% - 24px),transparent) no-repeat bottom/100% 1px}
.prule{background:linear-gradient(to right,transparent,var(--color-rule) 32px,var(--color-rule) calc(100% - 32px),transparent) no-repeat bottom/100% 1px}
.topfade{background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat top/100% 1px}
.dim{opacity:.5}
.kicker{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-500)}

/* stage pipeline: md (overview rows), sm (compact), lg (detail) */
.rail{display:flex;align-items:center}
.rail .step{display:flex;align-items:center}
.rail .step+.step{flex:1}
.rail .conn{flex:1;height:1px}
.node{border-radius:50%;flex:none;border-width:1.5px}
.rail.md{height:10px}.rail.md .node{width:10px;height:10px}
.rail.sm{height:8px}.rail.sm .node{width:7px;height:7px;border-width:1px}
.node.done{background:var(--color-neutral-500);border-style:solid;border-color:var(--color-neutral-500)}
.node.now{background:var(--color-accent);border-style:solid;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-900),0 0 10px var(--color-accent-600)}
.rail.sm .node.now{box-shadow:0 0 0 2px var(--color-accent-900),0 0 6px var(--color-accent-600)}
.node.todo{border-style:solid;border-color:var(--color-neutral-700)}
.node.none{border-style:dashed;border-color:var(--color-accent-600)}
.node.bad{border-style:dotted;border-color:var(--color-error)}
.conn.done{background:var(--color-neutral-500)}
.conn.todo,.conn.bad{background:var(--color-neutral-800)}
.conn.none{background:var(--color-accent-900)}

.bars{display:flex;align-items:flex-end;gap:2px}
.bars>span{flex:1;border-radius:1px;background:var(--color-neutral-800)}
.bars .on{background:var(--color-neutral-500)}
.bars .old.on{background:var(--color-neutral-700)}
.bars .recent.on{background:var(--color-neutral-400)}
.bars .hot.on{background:var(--color-accent-500)}
.bars .unknown{background:repeating-linear-gradient(to right,var(--color-neutral-800) 0 2px,transparent 2px 4px)}

/* ---------------------------------------------------------------- overview */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px 24px 6px}
.brand{font-family:var(--font-heading);font-weight:500;font-size:17px;margin-right:auto;letter-spacing:-0.01em}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px;color:var(--color-neutral-500)}
.sources .src{display:inline-flex;align-items:center;gap:6px}
.sources .dot{width:6px;height:6px;background:var(--color-neutral-400)}
.sources .dot.bad{background:var(--color-error)}
.gear{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-md);color:var(--color-neutral-400);text-decoration:none;font-size:17px;transition:background .15s,color .15s}
.gear:hover{background:var(--color-surface);color:var(--color-text)}
.bannerwrap{padding:8px 24px 0}
.banner{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:8px 12px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm);font-size:13px;max-width:1200px}
.banner .rest{color:var(--color-neutral-400)}

.strip{padding:20px 24px 4px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.strip .sep{width:1px;height:38px;background:var(--color-neutral-800);align-self:flex-end;margin-bottom:4px}
.cell{cursor:pointer;text-align:left;background:transparent;border:0;border-radius:var(--radius-md);padding:6px 12px 7px;min-width:64px;display:flex;flex-direction:column;gap:5px;transition:background .15s}
.cell:hover{background:var(--color-surface)}
.cell .n{font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1}
.cell.big .n{font-size:30px}
.cell .l{font-size:11px;line-height:1.2;color:var(--color-neutral-500)}
.cell.zero .n{color:var(--color-neutral-600)}
.cell[aria-pressed=true],.cell[aria-pressed=true]:hover{background:var(--color-accent-900);box-shadow:inset 0 0 0 1px var(--color-accent-700)}
.cell[aria-pressed=true] .n{color:var(--color-accent-200)}
.cell[aria-pressed=true] .l{color:var(--color-accent-300)}

.controls{padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:1600px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .sep{width:1px;height:18px;margin:0 4px;background:var(--color-neutral-800)}
.chip{font-size:12.5px;line-height:1;padding:6px 10px;border-radius:var(--radius-md);cursor:pointer;background:transparent;color:var(--color-neutral-400);border:1px solid var(--color-neutral-800);display:inline-flex;gap:6px;align-items:center;transition:border-color .15s}
.chip:hover{border-color:var(--color-neutral-500)}
.chip span{opacity:.55;font-size:11px}
.chip[aria-pressed=true]{background:var(--color-accent-900);color:var(--color-accent-200);border-color:var(--color-accent-700)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-500)}
.sort .input{width:auto;min-height:30px;padding:3px 8px;font-size:12.5px}

.list{padding:0 24px 48px;display:flex;flex-direction:column}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:16px 10px 4px;display:flex;align-items:center;gap:8px;color:var(--color-neutral-500)}
.group::before{content:"";width:14px;height:1px;background:currentColor}
.group.focus{color:var(--color-accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 28px;padding:11px 10px 12px;color:inherit;text-decoration:none;border-radius:var(--radius-md)}
.row:hover{color:inherit}

const pct=(n,mx,min)=>Math.max(min,Math.round(n/Math.max(1,mx)*100))+'%';
function bytes(n){
  if(n<1024)return n+' B';const u=['KB','MB','GB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return (n<10?n.toFixed(1):Math.round(n))+' '+u[i];
}

// ---------------------------------------------------------------- project model
// Traffic in the handoff's three forms: null (not collected, e.g. private), 'unavailable'
// (token can't read it, nothing stored), or an object built from the stored daily history.
function trafficOf(p){
  if(!p.trafficCollected)return null;
  const t=p.traffic||{},dates=Object.keys(t.views||{}).sort();
  const unavailable=t.status==='unavailable';
  if(!dates.length)return unavailable?'unavailable':'pending';
  const daily=[];
  for(let d=new Date(dates[0]+'T00:00:00Z');;d=new Date(d.getTime()+DAY)){
    const k=d.toISOString().slice(0,10),v=t.views[k],c=(t.clones||{})[k];
    daily.push({date:k,known:!!(v||c),views:v?v.count:0,viewsUnique:v?v.uniques:0,clones:c?c.count:0,clonesUnique:c?c.uniques:0});
    if(k>=dates[dates.length-1])break;
  }
  return {daily,since:dates[0],latest:dates[dates.length-1],fetchedAt:t.fetchedAt,unavailable,
    views14:t.last14?t.last14.views:null,clones14:t.last14?t.last14.clones:null,
    referrers:(t.referrers||[]).map(r=>({source:r.referrer,views:r.count,uniques:r.uniques})),
    paths:(t.paths||[]).map(r=>({path:r.path,title:r.title,views:r.count,uniques:r.uniques}))};
}

function enrich(raw){
  // Defaults cover data saved by an older version, rendered before the first refresh.
  const p={stars:0,forks:0,watchers:0,releases:[],releaseCount:0,downloads:0,traffic:null,trafficCollected:false,fork:false,...raw};
  const idx=DATA.stages.indexOf(p.stage);
  const hasStage=idx>=0, bad=!!p.stageError, noStage=!hasStage&&!bad;
  const last=p.lastCommit, lastDays=last?daysSince(last.date):null;
  const quiet=lastDays!=null&&lastDays>=DATA.staleDays&&!p.archived&&!p.paused;
  const stale=hasStage&&last&&p.stageUpdated&&daysSince(p.stageUpdated)>DATA.staleDays&&new Date(last.date)>new Date(p.stageUpdated);
  // One flag per row, first match wins (handoff order).
  let flag=null,flagClass='muted';
  if(bad){flag='Invalid project file';flagClass='error';}
  else if(noStage){flag='No project file';flagClass='nostage';}
  else if(p.archived)flag='Archived';
  else if(p.paused)flag='Paused';
  else if(!last){flag='No commits yet';flagClass='warn';}
  else if(quiet){flag='Quiet · '+lastDays+'d';flagClass='warn';}
  else if(stale){flag='Stage may be out of date';flagClass='warn';}
  const stageLabel=hasStage?STAGE_LABEL[p.stage]:noStage?'No project file':'Invalid file';
  const t=trafficOf(p);
  return {...p,idx,hasStage,bad,noStage,lastDays,quiet,stale,flag,flagClass,stageLabel,t,
    stageClass:hasStage?'':noStage?'nostage':'error',
    stageSub:hasStage?(p.stageUpdated?'changed '+ago(p.stageUpdated):''):noStage?'to do':'see file',
    nextText:p.next||(noStage?'Set in '+FILE:'No next step'),
    lastWarn:quiet||!last,
    dim:p.paused||p.archived,
    aria:p.name+', '+stageLabel+(flag?', '+flag:'')+', next: '+(p.next||'none'),
    href:'#/'+p.id};
}
// Hidden repos (Settings) are off the overview, compact panel, counts and detail routes.
const projects=()=>DATA.projects.filter(p=>!p.hidden).map(enrich);

function railSteps(p){
  return DATA.stages.map((s,i)=>{
    const st=p.hasStage?(i<p.idx?'done':i===p.idx?'now':'todo'):p.bad?'bad':'none';
    const conn=p.hasStage?(i<=p.idx?'done':'todo'):st;
    return {label:STAGE_LABEL[s],st,conn};
  });
}
const stageAria=p=>p.stageLabel+(p.hasStage?', stage '+(p.idx+1)+' of 6':'');
function rail(p,size){
  return h('div',{class:'rail '+size,role:'img','aria-label':stageAria(p)},
    railSteps(p).map((s,i)=>h('span',{class:'step'},i?h('span',{class:'conn '+s.conn}):null,h('span',{class:'node '+s.st,title:s.label}))));
}

// ---------------------------------------------------------------- overview
const STRIP_FILTERS={all:()=>true,focus:p=>p.focus,paused:p=>p.paused,nostage:p=>p.noStage,invalid:p=>p.bad};
const STRIP_LABEL={focus:'Focus',paused:'Paused',nostage:'No project file',invalid:'Invalid file'};
const matchFilter=(p,f)=>f.startsWith('stage:')?p.stage===f.slice(6):(STRIP_FILTERS[f]||STRIP_FILTERS.all)(p);
const catOf=p=>p.category||'Uncategorised';
const matchCat=(p,c)=>c==='all'||catOf(p)===c;
const lastTime=p=>p.lastCommit?+new Date(p.lastCommit.date):0;
const SORTS={
  stage:(a,b)=>(b.idx-a.idx)||a.name.localeCompare(b.name),
  recent:(a,b)=>lastTime(b)-lastTime(a),
  quiet:(a,b)=>lastTime(a)-lastTime(b),
  name:(a,b)=>a.name.localeCompare(b.name),
};
function groupsOf(list,filter){
  if(filter==='focus'||!list.some(p=>p.focus))return [{label:null,items:list}];
  return [{label:'Focus',cls:'focus',items:list.filter(p=>p.focus)},{label:'Everything else',items:list.filter(p=>!p.focus)}];
}
const kindOf=s=>s.kind==='Organization'?'organization':'account';
function sourcesLine(){
  return h('div',{class:'sources'},
    DATA.sources.map(s=>h('span',{class:'src',title:kindOf(s)+' · '+(s.error?s.error:'ok · '+plural(s.count,'repo'))},h('span',{class:'dot'+(s.error?' bad':'')}),s.owner)),
    h('span',{class:'faint'},'Refreshed '+clock(DATA.generatedAt)+' · every '+DATA.refreshMinutes+' min'),
    h('a',{href:'#/settings',class:'gear','aria-label':'Settings',title:'Settings'},icon('gear-six')));
}
function banner(){
  const bad=DATA.sources.filter(s=>s.error);
  if(!bad.length)return null;
  return h('div',{class:'bannerwrap'},h('div',{class:'banner',role:'status'},bad.map(s=>h('span',null,
    h('span',{class:'error'},s.owner+': '+sentence(s.error)),' ',
    h('span',{class:'rest'},s.fetchedAt?'Showing its last good data from '+when(s.fetchedAt)+'. The page will recover on the next successful refresh.':'No data from this source yet.')))));

function overview(){
  const all=projects(),{filter,cat,sort}=ui;
  const count=key=>all.filter(p=>matchFilter(p,key)&&matchCat(p,cat)).length;
  const cell=(key,label,cls='')=>{const n=count(key),on=filter===key;
    return h('button',{type:'button',class:'cell '+cls+(n?'':' zero'),'aria-pressed':String(on),onclick:()=>setUi('filter',on&&key!=='all'?'all':key)},
      h('span',{class:'n '+(n&&!on?({nostage:'nostage',invalid:'error'}[key]||''):''),style:n&&!on&&key==='paused'?'color:var(--color-neutral-400)':null},n),h('span',{class:'l'},label));};
  const sep=()=>h('span',{class:'sep','aria-hidden':'true'});
  const strip=h('section',{class:'strip',role:'group','aria-label':'Summary and stage filter'},
    cell('all','projects','big'),cell('focus','Focus'),sep(),
    DATA.stages.map(s=>cell('stage:'+s,STAGE_LABEL[s])),sep(),
    cell('paused','Paused'),cell('nostage','No project file'),cell('invalid','Invalid file'));

  const cats=[...new Set(all.map(catOf))].sort();
  const chip=(key,label)=>{const on=cat===key;
    return h('button',{type:'button',class:'chip','aria-pressed':String(on),onclick:()=>setUi('cat',key)},label,h('span',null,all.filter(p=>matchFilter(p,filter)&&matchCat(p,key)).length));};
  const sel=h('select',{class:'input',onchange:e=>setUi('sort',e.target.value)},
    [['stage','Furthest along'],['recent','Most recent commit'],['quiet','Quietest first'],['name','Name']].map(([v,l])=>h('option',{value:v,selected:sort===v},l)));
  const controls=h('section',{class:'controls','aria-label':'Category filter and sort'},
    h('div',{class:'chips',role:'group','aria-label':'Category'},chip('all','All categories'),sep(),cats.map(c=>chip(c,c))),
    h('label',{class:'sort'},'Sort',sel));

  const list=all.filter(p=>matchFilter(p,filter)&&matchCat(p,cat)).sort(SORTS[sort]);
  const main=h('main',{class:'list'});
  for(const g of groupsOf(list,filter)){
    if(!g.items.length)continue;
    if(g.label)main.append(h('div',{class:'group '+(g.cls||'')},g.label));
    main.append(...g.items.map(row));
  }
  if(!list.length){
    const labels=[filter!=='all'?(filter.startsWith('stage:')?STAGE_LABEL[filter.slice(6)]:STRIP_LABEL[filter]):null,cat!=='all'?cat:null].filter(Boolean);
    main.append(h('div',{class:'empty'},h('div',{class:'h'},'No projects match'),
      h('div',{class:'muted',style:'font-size:13px'},'No project matches '+(labels.join(' in ')||'this filter')+'.'),
      h('button',{type:'button',class:'btn btn-primary',onclick:()=>{ui.cat='all';setUi('filter','all');}},'Show all projects')));
  }
  return [h('header',{class:'top'},h('div',{class:'brand'},'Project yard'),sourcesLine()),banner(),strip,controls,main];
}

    h('div',{class:'cap'},total+' commits · 12w'));
}

  const all=projects(),f=ui.cfilter;
  const list=all.filter(p=>f!=='focus'||p.focus).sort(SORTS.stage);
  const bad=DATA.sources.filter(s=>s.error);

      h('div',{class:'l1'},p.focus?h('span',{class:'dot focusdot',title:'Focus'}):null,h('span',{class:'name ell'},p.name),h('span',{class:'st '+p.stageClass},p.stageLabel)),

function detail(id){
  const p=projects().find(p=>p.id.toLowerCase()===id.toLowerCase());
  const back=h('a',{href:'#/',class:'back'},'← All projects');
  if(!p)return [h('div',{class:'detail'},back,h('div',{class:'notfound'},h('div',{class:'h'},'No project at this address'),
    h('div',{class:'muted',style:'margin-top:6px;font-size:13px'},id+' isn’t on the board. It may be hidden in Settings.')))];
  document.title=p.name+' · Project yard';
  const t=p.t,tObj=t&&typeof t==='object'?t:null;

  const stat=(label,value,cls)=>h('div',null,h('dt',null,label),h('dd',{class:cls||null},value));
  const row1=[stat('Open issues',p.openIssues),stat('Commits · 12w',p.commits12w),
    stat('Last commit',p.lastCommit?short(p.lastCommit.date):'—',p.lastWarn?'warn':null),stat('Stage changed',p.stageUpdated?short(p.stageUpdated):'—')];
  const row2=[stat('Stars',fmtN(p.stars)),stat('Forks',fmtN(p.forks)),stat('Watchers',fmtN(p.watchers)),stat('Downloads',fmtN(p.downloads))];
  if(t){  // collected for this repo (public, or private with include_private)
    const has=tObj&&tObj.views14;
    row1.push(stat('Views · 14d',has?fmtN(tObj.views14.uniques):'—',has?null:'faint'));
    row2.push(stat('Clones · 14d',has?fmtN(tObj.clones14.uniques):'—',has?null:'faint'));
  }
  const head=h('header',{class:'d-head'},
    h('div',{class:'d-id'+(p.dim?' dim':'')},
      h('div',{class:'title'},p.focus?h('span',{class:'dot focusdot',title:'Focus'}):null,h('h1',null,p.name),

        h('span',{class:'tag tag-outline quiet',style:'border-color:var(--color-neutral-700)'},p.private?'private':'public'),
        p.archived?h('span',{class:'tag tag-neutral'},'archived'):null,
        p.paused?h('span',{class:'tag tag-outline quiet'},'paused'):null),
      p.summary?h('p',null,p.summary):null,
      h('div',{class:'links'},h('a',{href:p.url,target:'_blank',rel:'noopener'},p.id+' ↗'),p.flag?h('span',{class:p.flagClass},p.flag):null)),
    h('dl',{class:'stats',style:'flex:0 1 '+(t?600:480)+'px;grid-template-columns:repeat('+row1.length+',minmax(0,1fr))'},row1,row2));

  let trafficRow=null;
  if(tObj)trafficRow=[tObj.unavailable?trafficNote('Traffic unavailable. The token can’t read traffic for this repo; showing what was collected before.'):null,
    h('div',{class:'drow'},viewsPanel(tObj),topPanel(p,tObj,'referrers'),topPanel(p,tObj,'paths'))];
  else if(t==='unavailable')trafficRow=trafficNote('Traffic unavailable. The token can’t read traffic for this repo.');
  else if(t==='pending')trafficRow=trafficNote('Traffic is read once a day. It shows up after the next read.');

  return [h('div',{class:'detail'},back,head,h('div',{class:'drows'},
    h('div',{class:'drow'},stagePanel(p),activityPanel(p),repoPanel(p)),
    notesPanel(p),
    trafficRow,
    h('div',{class:'drow'},commitsPanel(p),issuesPanel(p),releasesPanel(p))))];

function activityPanel(p){

    h('div',{class:'bars',role:'img','aria-label':total52+' commits over 52 weeks'},y.weeks.map((w,i)=>{

      return h('span',{class:cls,style:'height:'+(w?pct(w,mx,4):'2px'),title:plural(w,'commit')+', week of '+wk});

// Notes: "## " heading, "- " bullet, other lines paragraphs. One flat list of blocks so the
// columns can break between any two of them; paragraphs and bullets stay whole.
function noteBlocks(txt){
  const out=[];
  for(const raw of (txt||'').split('\n')){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('## '))out.push({kind:'h',text:l.slice(3)});
    else if(l.startsWith('- '))out.push({kind:'li',text:l.slice(2)});
    else out.push({kind:'p',text:l});
  }
  return out;
}
function notesPanel(p){
  const blocks=noteBlocks(p.notes),heads=blocks.filter(b=>b.kind==='h').length,paras=blocks.filter(b=>b.kind==='p').length;
  const meta=(heads>1?heads+' sections · ':paras>3?paras+' paragraphs · ':'')+FILE;
  return panel('Notes',null,ph('Notes',phc(meta)),
    blocks.length?h('div',{class:'notes-cols'},blocks.map(b=>b.kind==='h'?h('div',{class:'nh'},b.text):b.kind==='li'?h('div',{class:'li'},b.text):h('p',null,b.text)))
    :h('div',{class:'none'},p.noStage?'Notes come from '+FILE+'.':'No notes in '+FILE+'.'));
}

// Ranges the stored history covers: 14d always, 90d past 14 days, All past 90. Over 120
// days the bars are weekly sums. The 14d unique figures are GitHub's own window counts;
// longer ranges add up daily uniques, which overlap, so they're marked approximate.
function viewsPanel(t){
  const n=t.daily.length,avail=[['14','14d',14]];
  if(n>14)avail.push(['90','90d',Math.min(90,n)]);
  if(n>90)avail.push(['all','All',n]);
  const cur=avail.find(a=>a[0]===ui.range)||avail[avail.length-1];
  let win=t.daily.slice(-cur[2]).map(d=>({...d,label:d.date})),bucket='daily';
  if(win.length>120){
    const b=[];
    for(let i=win.length;i>0;i-=7){
      const ch=win.slice(Math.max(0,i-7),i),sum=k=>ch.reduce((a,x)=>a+x[k],0);
      b.unshift({views:sum('views'),viewsUnique:sum('viewsUnique'),clones:sum('clones'),clonesUnique:sum('clonesUnique'),known:ch.some(x=>x.known),label:'week of '+ch[0].date});
    }
    win=b;bucket='weekly';
  }
  const exact=cur[0]==='14'&&t.views14;
  const metric=(label,k,ku,cls,minH,api)=>{
    const mx=Math.max(1,...win.map(x=>x[k]));
    const total=exact?api.count:win.reduce((a,x)=>a+x[k],0),uniq=exact?api.uniques:win.reduce((a,x)=>a+x[ku],0);
    return h('div',{class:'metric '+cls},
      h('div',{class:'mh'},h('span',{class:'k'},label),h('span',{class:'u'},(exact?'':'≈')+fmtN(uniq)+' unique'),h('span',{class:'tot'},fmtN(total)+' total')),
      h('div',{class:'tbars',role:'img','aria-label':label+', '+win.length+' '+(bucket==='weekly'?'weeks':'days')+', '+fmtN(total)+' total',style:'min-height:'+minH+'px;gap:'+(win.length>60?1:2)+'px'},
        win.map(x=>!x.known?h('span',{class:'unknown',style:'height:1px',title:x.label+': not tracked'})
          :h('span',{style:'height:'+(x[k]?pct(x[k],mx,3):'1px'),title:x.label+': '+fmtN(x[k])+' '+label.toLowerCase()+', '+fmtN(x[ku])+' unique'},
            h('i',{style:'height:'+(x[k]?Math.round(x[ku]/x[k]*100):0)+'%'})))));
  };
  const sum=k=>t.daily.reduce((a,x)=>a+x[k],0);
  return panel('Views and clones',null,
    h('div',{class:'ph'},h('span',{class:'t'},'Views & clones'),
      h('div',{class:'seg range',role:'group','aria-label':'Range'},avail.map(([k,l])=>h('label',{class:'seg-opt'},
        h('input',{type:'radio',name:'yard-tr',checked:k===cur[0],onchange:()=>setUi('range',k)}),l)))),
    metric('Views','views','viewsUnique','views',72,t.views14),
    metric('Clones','clones','clonesUnique','clones',40,t.clones14),
    h('div',{class:'axis'},h('span',null,win.length?win[0].label.replace('week of ',''):''),
      h('span',{class:'legend'},h('span',null,h('i',{class:'sw-u'}),'unique'),h('span',null,h('i',{class:'sw-t'}),'total'),h('span',{class:'muted'},bucket)),
      h('span',null,t.latest)),
    h('div',{class:'since topfade'},h('div',{class:'kicker'},'Since tracking began · '+t.since),
      h('dl',null,
        h('div',null,h('dt',null,'Views'),h('dd',null,h('b',null,fmtN(sum('views'))),h('span',{title:'Daily uniques added up; someone who visits on two days counts twice'},'≈'+fmtN(sum('viewsUnique'))+' unique'))),
        h('div',null,h('dt',null,'Clones'),h('dd',null,h('b',null,fmtN(sum('clones'))),h('span',{title:'Daily uniques added up; someone who clones on two days counts twice'},'≈'+fmtN(sum('clonesUnique'))+' unique'))))));
}
function topPanel(p,t,kind){
  const refs=kind==='referrers',rows=refs?t.referrers:t.paths,mx=Math.max(1,...rows.map(r=>r.views));
  const origin=p.url.startsWith('http')?new URL(p.url).origin:'https://github.com',prefix='/'+p.id;
  return panel(refs?'Top referrers':'Popular pages',null,ph(refs?'Top referrers':'Popular pages',phc('last 14 days')),
    rows.length?[h('div',{class:'tl-head'},h('span',null,refs?'Source':'Path'),h('span',null,'Views'),h('span',null,'Unique')),
      h('ul',{class:'lines tl scroll'},rows.map(r=>h('li',{class:'prule'},
        h('div',{class:'r'},refs?h('span',{class:'ell'},r.source)
          :h('a',{href:origin+r.path,target:'_blank',rel:'noopener',class:'ell mono',title:r.path+(r.title?' · '+r.title:'')},r.path.startsWith(prefix)?(r.path.slice(prefix.length)||'/'):r.path),
          h('span',null,fmtN(r.views)),h('span',{class:'uq'},fmtN(r.uniques))),
        h('div',{class:'share','aria-hidden':'true'},h('i',{style:'width:'+pct(r.views,mx,2)})))))]
    :h('div',{class:'none'},refs?'No referrers in the last 14 days.':'No page views in the last 14 days.'));
}

function commitsPanel(p){
  return panel('Recent commits',null,ph('Recent commits',phc(p.commits.length?'last '+p.commits.length:null)),
    p.commits.length?h('ol',{class:'lines commits scroll'},p.commits.map(c=>h('li',{class:'prule'},h('span',{class:'date'},isoDate(c.date)),h('a',{href:c.url,target:'_blank',rel:'noopener',class:'ell',title:c.message},c.message))))
      :h('div',{class:'none'},'Nothing pushed yet.'));
}

function issuesPanel(p){
  const more=p.openIssues-p.issues.length;
  return panel('Open issues',null,ph('Open issues',phc(p.openIssues+' open')),
    p.issues.length?h('ul',{class:'lines issuelist scroll'},p.issues.map(i=>h('li',{class:'prule'},
        h('a',{href:i.url,target:'_blank',rel:'noopener'},i.title),
        i.labels.length?h('span',{class:'labels'},i.labels.map(l=>h('span',{class:'tag tag-neutral sm'},l))):null,
        h('span',{class:'age'},short(i.createdAt))))):h('div',{class:'none'},'No open issues.'),
    more>0?h('a',{class:'more',href:p.url+'/issues',target:'_blank',rel:'noopener'},plural(more,'more issue')+' on GitHub ↗'):null);
}

function releasesPanel(p){
  const [latest,...older]=p.releases;
  const header=ph('Releases',phc(fmtN(p.downloads)+' downloads all time'));
  if(!latest)return panel('Releases',null,header,h('div',{class:'none'},'No releases yet.'));
  // Releases saved by v0.3 have no asset list; they still show the latest tag and its total.
  const assets=latest.assets||[],top=Math.max(1,...assets.map(a=>a.downloads));
  return panel('Releases',null,header,h('div',{class:'relbody scroll'},
    h('div',{class:'rel-latest'},
      h('a',{class:'tagname',href:latest.url,target:'_blank',rel:'noopener',title:latest.name},latest.tag),
      latest.prerelease?h('span',{class:'tag tag-outline quiet sm'},'pre-release'):null,
      h('span',{class:'when'},isoDate(latest.publishedAt)+' · '+ago(latest.publishedAt)),
      h('span',{class:'tot'},fmtN(latest.downloads)+' downloads')),
    assets.length?h('ul',{class:'lines assets'},assets.map(a=>h('li',{class:'prule'},
      h('div',{class:'a'},h('a',{href:a.url||latest.url},h('span',{'aria-hidden':'true',style:'flex:none'},'↓'),h('span',{class:'ell'},a.name)),
        h('span',{class:'size'},bytes(a.size)),h('span',{class:'cnt'},fmtN(a.downloads))),
      h('div',{class:'share','aria-hidden':'true'},h('i',{style:'width:'+pct(a.downloads,top,2)}))))):null,
    older.length?h('div',{class:'earlier'},h('span',{class:'kicker'},'Earlier'),older.map(r=>h('div',{class:'o'},
      h('a',{href:r.url,target:'_blank',rel:'noopener'},r.tag),h('span',{class:'d'},isoDate(r.publishedAt)),h('span',{class:'n'},fmtN(r.downloads))))):null,
    p.releaseCount>p.releases.length?h('div',{class:'quiet'},'Counts the newest '+p.releases.length+' of '+p.releaseCount+' releases.'):null));
}

// ---------------------------------------------------------------- settings
// Toggling applies to the board at once, then saves; a failed save reverts the toggle.
const save={state:'idle',at:null,fail:null};
const isNew=p=>p.firstSeen&&DATA.seenSince&&p.firstSeen>DATA.seenSince&&daysSince(p.firstSeen)<=7;
function settings(){
  document.title='Settings · Project yard';
  const list=[...DATA.projects].sort((a,b)=>(a.name||a.repo).localeCompare(b.name||b.repo));
  const hiddenN=list.filter(p=>p.hidden).length;
  const status={idle:'Changes save automatically',saving:'Saving…',saved:'Saved · '+(save.at?clock(save.at):''),failed:'Not saved'}[save.state];
  const owners=DATA.sources.map(s=>s.owner).join(' and ');
  return [h('div',{class:'settings'},h('a',{href:'#/',class:'back'},'← All projects'),
    h('header',{class:'s-head'},h('h1',null,'Settings'),
      h('span',{class:'savestate'+(save.state==='saved'?' ok':save.state==='failed'?' failed':''),role:'status','aria-live':'polite'},save.state==='saved'?icon('check'):null,status)),
    h('p',{class:'s-intro'},'Every repo the collector finds for '+owners+'. Hidden repos leave the board and the panel straight away and stay listed here so you can bring them back. New repos are shown by default.'),
    save.state==='failed'&&save.fail?h('div',{class:'s-alert',role:'alert'},
      h('span',{class:'error'},'Couldn’t save: '+save.fail.text+'.'),h('span',{class:'muted',style:'color:var(--color-neutral-400)'},'Nothing was changed.'),
      h('button',{type:'button',class:'btn btn-secondary',onclick:()=>toggleHidden(save.fail.id,save.fail.hide)},'Try again')):null,
    panel('Repositories','s-repos',
      h('div',{class:'ph'},h('span',{class:'t'},'Repositories'),phc((list.length-hiddenN)+' shown · '+hiddenN+' hidden')),
      list.length?h('ul',{class:'lines'},list.map(p=>{
        const tags=[];
        if(p.hidden)tags.push(['hidden','tag-outline']);
        if(p.archived)tags.push(['archived','tag-neutral']);
        if(p.fork)tags.push(['fork','tag-neutral']);
        if(isNew(p))tags.push(['new','tag-accent']);
        if(!tags.length)tags.push(['shown','tag-neutral']);
        return h('li',{class:'s-row prule'+(p.hidden?' off':'')},
          h('button',{type:'button',class:'switch',role:'switch','aria-checked':String(!p.hidden),'aria-label':(p.hidden?'Show ':'Hide ')+p.name,
            onclick:()=>toggleHidden(p.id,!p.hidden)}),
          h('div',{class:'nm'},h('div',{class:'n ell'},p.name),h('div',{class:'id ell'},p.id)),
          h('div',{class:'tags'},tags.map(([l,c])=>h('span',{class:'tag '+c},l))));
      })):h('div',{class:'none'},'No repos yet. They appear after the first refresh.')))];
}
async function toggleHidden(id,hide){
  const p=DATA.projects.find(x=>x.id===id);if(!p)return;
  p.hidden=hide;save.state='saving';save.fail=null;render();
  try{
    const r=await fetch('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({hidden:DATA.projects.filter(x=>x.hidden).map(x=>x.id)})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(body.error||('HTTP '+r.status));
    const saved=new Set(body.hidden.map(s=>s.toLowerCase()));
    for(const x of DATA.projects)x.hidden=saved.has(x.id.toLowerCase());
    save.state='saved';save.at=new Date();
  }catch(e){
    p.hidden=!hide;
    save.state='failed';save.fail={id,hide,text:(hide?'hiding ':'showing ')+p.name};
    console.warn('settings save failed:',e.message);
  }
  render();
}

// ---------------------------------------------------------------- routing + refresh
function render(){
  const hash=decodeURIComponent(location.hash),m=/^#\/(.+\/.+)$/.exec(hash);
  document.title='Project yard';
  const app=document.getElementById('app');
  app.replaceChildren(...(hash==='#/settings'?settings():m?detail(m[1]):COMPACT.matches?compact():overview()).filter(Boolean));
}
let lastRoute=location.hash;
addEventListener('hashchange',()=>{render();if(location.hash!==lastRoute)scrollTo(0,0);lastRoute=location.hash;});
COMPACT.addEventListener('change',render);
render();

// The server rewrites data.json every refresh; pick it up without reloading the page.
setInterval(async()=>{
  if(document.visibilityState!=='visible'||save.state==='saving')return;
  try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){DATA=await r.json();render();}}catch{}
},5*60*1000);
</script>
