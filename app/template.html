<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project yard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
/* Design: docs/design/ (Nocturne tokens, Project yard v2 mockups). Dark only. */
:root{
  color-scheme:dark;
  --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
  --color-rule:color-mix(in srgb,#e9e9ed 8%,transparent);
  --color-neutral-300:#cfd3e5; --color-neutral-400:#b2b6ca; --color-neutral-500:#9397ab;
  --color-neutral-600:#75798c; --color-neutral-700:#595d6c; --color-neutral-800:#3f424d;
  --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd; --color-accent-400:#b5abfc; --color-accent-500:#968ae0;
  --color-accent-600:#796cbf; --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;
  --color-error:oklch(0.74 0.13 25); --color-warn:oklch(0.8 0.1 80);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius-sm:4px; --radius-md:8px;
  --shadow-sm:0 0 0 1px #3f424d;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--color-accent);text-underline-offset:3px}
a:hover{color:var(--color-accent-400)}
button,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
h1{font-weight:500;letter-spacing:-0.015em;line-height:1.12}
.muted{color:var(--color-neutral-500)}
.faint{color:var(--color-neutral-600)}
.error{color:var(--color-error)}
.warn{color:var(--color-warn)}
.nostage{color:var(--color-accent-300)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:6px;background:var(--color-neutral-800);color:#f3f5fe}
.tag.outline{background:none;border:1px solid var(--color-neutral-700);color:var(--color-neutral-400)}
.tag.sm{font-size:10px;padding:1px 7px}
.dot{border-radius:50%;flex:none;display:inline-block}
.focusdot{width:6px;height:6px;background:var(--color-accent);box-shadow:0 0 6px var(--color-accent)}
/* Rules fade to transparent at the ends (Nocturne). */
.rule{background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.rule:hover{background:linear-gradient(var(--color-surface),var(--color-surface)) no-repeat 0 0/100% 100%,linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.btn{cursor:pointer;background:transparent;border:1px solid var(--color-accent);color:var(--color-accent);border-radius:var(--radius-md);padding:6px 10px;font-weight:500}
.btn:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
select.input{min-height:30px;padding:3px 8px;font-size:12.5px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
select.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
select.input option{background:var(--color-surface)}

/* stage rail: small (rows) and large (detail) */
.rail{display:flex;align-items:center}
.rail .step{display:flex;align-items:center}
.rail .step+.step{flex:1}
.rail .conn{flex:1;height:1px}
.node{border-radius:50%;flex:none;border-width:1.5px}
.rail.md{height:10px}.rail.md .node{width:10px;height:10px}
.rail.sm{height:8px}.rail.sm .node{width:7px;height:7px;border-width:1px}
.node.done{background:var(--color-neutral-500);border-style:solid;border-color:var(--color-neutral-500)}
.node.now{background:var(--color-accent);border-style:solid;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-900),0 0 10px var(--color-accent-600)}
.rail.sm .node.now{box-shadow:0 0 0 2px var(--color-accent-900),0 0 6px var(--color-accent-600)}
.node.todo{border-style:solid;border-color:var(--color-neutral-700)}
.node.none{border-style:dashed;border-color:var(--color-accent-600)}
.node.bad{border-style:dotted;border-color:var(--color-error)}
.conn.done{background:var(--color-neutral-500)}
.conn.todo,.conn.bad{background:var(--color-neutral-800)}
.conn.none{background:var(--color-accent-900)}

.bars{display:flex;align-items:flex-end;gap:2px}
.bars span{flex:1;border-radius:1px;background:var(--color-neutral-800)}
.bars .on{background:var(--color-neutral-500)}
.bars .hot{background:var(--color-accent-500)}
.bars .old.on{background:var(--color-neutral-700)}
.bars .recent.on{background:var(--color-neutral-400)}
.bars .unknown{background:repeating-linear-gradient(to right,var(--color-neutral-800) 0 2px,transparent 2px 4px)}

/* ---------------------------------------------------------------- overview */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px 24px 6px}
.brand{font-weight:500;font-size:17px;margin-right:auto;letter-spacing:-0.01em}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px;color:var(--color-neutral-500)}
.sources .src{display:inline-flex;align-items:center;gap:6px}
.sources .dot{width:6px;height:6px;background:var(--color-neutral-400)}
.sources .dot.bad{background:var(--color-error)}
.banner{margin:8px 24px 0;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm);font-size:13px;max-width:1200px}
.banner .rest{color:var(--color-neutral-400)}

.strip{padding:20px 24px 4px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.strip .sep{width:1px;height:38px;background:var(--color-neutral-800);margin-bottom:4px}
.cell{cursor:pointer;text-align:left;background:transparent;border:0;border-radius:var(--radius-md);padding:6px 12px 7px;min-width:64px;display:flex;flex-direction:column;gap:5px}
.cell:hover{background:var(--color-surface)}
.cell .n{font-weight:500;font-size:22px;line-height:1}
.cell.big .n{font-size:30px}
.cell .l{font-size:11px;line-height:1.2;color:var(--color-neutral-500)}
.cell.zero .n{color:var(--color-neutral-600)}
.cell[aria-pressed=true]{background:var(--color-accent-900);box-shadow:inset 0 0 0 1px var(--color-accent-700)}
.cell[aria-pressed=true] .n{color:var(--color-accent-200)}
.cell[aria-pressed=true] .l{color:var(--color-accent-300)}

.controls{padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:1600px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .sep{width:1px;height:18px;margin:0 4px;background:var(--color-neutral-800)}
.chip{font-size:12.5px;line-height:1;padding:6px 10px;border-radius:var(--radius-md);cursor:pointer;background:transparent;color:var(--color-neutral-400);border:1px solid var(--color-neutral-800);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--color-neutral-500)}
.chip span{opacity:.55;font-size:11px}
.chip[aria-pressed=true]{background:var(--color-accent-900);color:var(--color-accent-200);border-color:var(--color-accent-700)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-500)}

.list{padding:0 24px 48px;display:flex;flex-direction:column}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:16px 10px 4px;display:flex;align-items:center;gap:8px;color:var(--color-neutral-500)}
.group::before{content:"";width:14px;height:1px;background:currentColor}
.group.focus{color:var(--color-accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 28px;padding:11px 10px 12px;color:inherit;text-decoration:none;border-radius:var(--radius-md)}
.row:hover{color:inherit}
.dim{opacity:.5}
.row .who{flex:1 1 240px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.row .name{font-weight:500;font-size:15px}
.row .priv{font-size:10.5px;color:var(--color-neutral-600);letter-spacing:.04em}
.row .summary{font-size:12.5px;color:var(--color-neutral-400)}
.row .meta{font-size:12px;color:var(--color-neutral-500);display:flex;gap:4px 10px;flex-wrap:wrap}
.row .next{flex:2 1 280px;max-width:640px;min-width:0;padding-top:1px}
.row .next .k{font-size:11px;color:var(--color-neutral-600);line-height:1.3;margin-bottom:2px}
.row .next .v{font-size:14px;line-height:1.35;text-wrap:pretty}
.row .stage{flex:0 0 180px;display:flex;flex-direction:column;gap:7px;padding-top:7px}
.row .stage .lbl{font-size:12px;display:flex;justify-content:space-between;gap:8px;line-height:1.2}
.row .stage .sub{color:var(--color-neutral-600);font-size:11px;white-space:nowrap}
.row .spark{flex:0 0 auto;min-width:90px;display:flex;flex-direction:column;gap:5px;padding-top:3px}
.row .spark .bars{height:22px}
.row .spark .cap{white-space:nowrap;font-size:11px;color:var(--color-neutral-500);line-height:1.2}
.row .last{flex:1 1 190px;max-width:280px;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:3px;font-size:12px;line-height:1.35}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv>:first-child{color:var(--color-neutral-500)}
.row .issues{display:none;flex:2 1 320px;max-width:720px;min-width:0;flex-direction:column;gap:3px;padding-top:3px;font-size:12px;line-height:1.35}
.row .issues .i{display:flex;gap:10px;min-width:0}
@media (min-width:2400px){.row .issues{display:flex}}
.empty{padding:56px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.empty .h{font-weight:500;font-size:17px}

/* ---------------------------------------------------------------- compact (KDE panel popup, ~420px) */
.c-top{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.c-top .brand{font-size:14px}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-sm)}
.seg button{background:none;border:0;padding:3px 9px;font-size:11.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--color-divider)}
.seg button[aria-pressed=true]{color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.seg button:not([aria-pressed=true]):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.c-err{margin:0 12px 6px;padding:5px 9px;border-radius:var(--radius-sm);background:var(--color-surface);font-size:11.5px;color:var(--color-error)}
.c-list{padding:0 6px 8px;display:flex;flex-direction:column}
.c-list .group{font-size:10px;padding:8px 6px 3px;gap:6px}
.c-list .group::before{width:10px}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 42px;gap:2px 10px;align-items:center;padding:6px 6px 7px;border-radius:var(--radius-sm);color:inherit;text-decoration:none}
.c-row:hover{color:inherit}
.c-row .l1{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.3}
.c-row .focusdot{width:5px;height:5px;box-shadow:0 0 5px var(--color-accent)}
.c-row .name{font-weight:500;font-size:13px}
.c-row .st{font-size:11px;white-space:nowrap}
.c-row .ago{font-size:11px;text-align:right}
.c-row .l2{grid-column:1/-1;display:flex;gap:8px;min-width:0;font-size:12px;line-height:1.3}

/* ---------------------------------------------------------------- detail */
.detail{max-width:1600px;padding:14px 24px 56px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;padding:4px 6px 4px 0}
.d-head{margin-top:20px;display:flex;flex-wrap:wrap;gap:14px 40px;align-items:flex-start}
.d-id{flex:1 1 340px;min-width:0}
.d-id .title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-id h1{font-size:30px;margin:0}
.d-id .focusdot{width:8px;height:8px;box-shadow:0 0 8px var(--color-accent)}
.d-id p{font-size:15px;color:var(--color-neutral-300);margin:8px 0;max-width:64ch;text-wrap:pretty}
.d-id .links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.d-id .links a{text-decoration:none}
.stats{flex:0 1 460px;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 20px}
.stats dt{font-size:11px;color:var(--color-neutral-500)}
.stats dd{margin:2px 0 0;font-weight:500;font-size:22px;line-height:1.1;white-space:nowrap}
.dgrid{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:stretch}
@media (min-width:1000px){.dgrid{grid-template-columns:3fr 3fr 2fr}.span2{grid-column:span 2}}
.panel{background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph .t{font-weight:500;font-size:15px}
.panel .ph .c{margin-left:auto;font-size:12px;color:var(--color-neutral-500)}
.panel .none{font-size:13px;color:var(--color-neutral-600)}
.stagepanel{gap:18px;padding-bottom:20px}
.stagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.stagehead .big{font-weight:500;font-size:20px}
.stagehead .why{font-size:12.5px;color:var(--color-neutral-500)}
.stagehead .mono{font-family:ui-monospace,monospace;color:var(--color-neutral-400)}
.bigrail{position:relative;display:flex;padding-top:2px;max-width:720px}
.bigrail .line{position:absolute;left:calc(100%/12);right:calc(100%/12);top:8.5px;height:1px}
.bigrail .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.bigrail .node{position:relative;width:14px;height:14px;border-width:1.5px}
.bigrail .node.todo,.bigrail .node.none,.bigrail .node.bad{background:var(--color-surface)}
.bigrail .lab{font-size:12px;color:var(--color-neutral-600);max-width:100%}
.bigrail .lab.done{color:var(--color-neutral-400)}
.bigrail .lab.now{color:var(--color-text)}
.kicker{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:6px}
.nextbig{font-size:17px;line-height:1.35;text-wrap:pretty;max-width:60ch}
.notes{font-size:13.5px;line-height:1.5;color:var(--color-neutral-300);white-space:pre-line;text-wrap:pretty}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lines li{display:flex;gap:14px;align-items:baseline;padding:6px 0;font-size:13px;background:linear-gradient(to right,transparent,var(--color-rule) 32px,var(--color-rule) calc(100% - 32px),transparent) no-repeat bottom/100% 1px}
.lines a{color:var(--color-text);text-decoration:none}
.lines a:hover{color:var(--color-accent-400)}
.commits{max-height:340px;overflow-y:auto}
.commits .date{flex:none;white-space:nowrap;color:var(--color-neutral-500);font-size:12px}
.commits a{flex:1}
.issuelist li{flex-wrap:wrap;gap:4px 12px;padding:7px 0}
.issuelist a{flex:1 1 180px;min-width:0}
.issuelist .labels{display:flex;gap:4px;flex-wrap:wrap}
.issuelist .age{flex:none;color:var(--color-neutral-500);font-size:12px;min-width:40px;text-align:right}
.more{font-size:12px}
.side{display:flex;flex-direction:column;gap:16px}
.activity{flex:1;gap:12px}
.activity .bars{flex:1;min-height:64px}
.activity .axis{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--color-neutral-600);flex-wrap:wrap}
.activity .axis .mid{color:var(--color-neutral-400)}
.repo dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;font-size:13px}
.repo dt{color:var(--color-neutral-500)}
.repo dd{margin:0;min-width:0}
.repo dd a.plain{color:var(--color-text);text-decoration:none}
.repo .sub{color:var(--color-neutral-500);font-size:12px}
/* traffic: total and unique overlaid on one axis (unique ≤ total) */
.tchart{display:flex;flex-direction:column;gap:6px;min-width:0}
.tchart .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px}
.tchart .hd .k{font-weight:500}
.legend{display:inline-flex;gap:12px;font-size:11px;color:var(--color-neutral-500)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbars{display:flex;align-items:stretch;gap:1px;height:72px}
.tbars .d{flex:1;position:relative;min-width:0;border-radius:2px}
.tbars .d:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.tbars .d i{position:absolute;left:0;right:0;bottom:0;border-radius:2px 2px 0 0}
.tbars .d.unknown i{background:repeating-linear-gradient(to right,var(--color-neutral-800) 0 2px,transparent 2px 4px)}
.c-total{background:var(--color-neutral-600)}
.c-unique{background:var(--color-accent-400)}
.tcharts{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){.tcharts{grid-template-columns:1fr 1fr}}
.axis{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--color-neutral-600);flex-wrap:wrap}
.totals{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12.5px;color:var(--color-neutral-400)}
.totals b{font-weight:500;color:var(--color-text)}
.lines .n{flex:none;margin-left:auto;color:var(--color-neutral-400);font-size:12px;white-space:nowrap}
.lines .n .faint{margin-left:6px}
.quiet{font-size:12px;color:var(--color-neutral-600)}

/* settings */
.gear{display:inline-flex;align-items:center;gap:6px;color:var(--color-neutral-400);text-decoration:none;font-size:12px;padding:4px 6px;border-radius:var(--radius-md)}
.gear:hover{color:var(--color-text);background:var(--color-surface)}
.gear svg{width:16px;height:16px}
.settings{max-width:820px;padding:14px 24px 56px}
.settings h1{font-size:24px;margin:20px 0 6px}
.settings .intro{color:var(--color-neutral-400);font-size:13.5px;margin:0 0 18px;max-width:64ch}
.settings .status{min-height:20px;font-size:12.5px;margin-bottom:6px}
.srow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--radius-md)}
.srow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .nm .id{font-size:12px;color:var(--color-neutral-500)}
.srow.off .nm{opacity:.55}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--color-neutral-400);min-width:92px;justify-content:flex-end}
.switch input{appearance:none;margin:0;width:34px;height:20px;border-radius:10px;background:var(--color-neutral-800);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--color-neutral-400);transition:transform .15s}
.switch input:checked{background:var(--color-accent-700)}
.switch input:checked::after{transform:translateX(14px);background:var(--color-accent-200)}
.switch input:disabled{opacity:.5;cursor:wait}
.notfound{padding:48px 0}
.notfound .h{font-weight:500;font-size:20px}

@media (max-width:560px){
  .detail{padding:10px 12px 32px}
  .d-id h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
let DATA=/*__DATA__*/null;

// ---------------------------------------------------------------- helpers
const STAGE_LABEL={idea:'Idea',scoping:'Scoping',design:'Design',building:'Building',testing:'Testing',live:'Live'};
const DAY=864e5;
const COMPACT=matchMedia('(max-width:560px)');
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{return null}};
const ui={filter:ls('yard.filter')||'all',cat:ls('yard.cat')||'all',sort:ls('yard.sort')||'stage',cfilter:ls('yard.cfilter')||'all'};
function setUi(k,v){ui[k]=v;ls('yard.'+k,v);render();}

// Build DOM with text nodes only: commit messages and issue titles are untrusted.
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}

  // trails today by a day or two. Days never returned by a read stay unknown.
  const first=days[0],latest=days[days.length-1];
  const from=new Date(Math.max(Date.parse(first),Date.parse(latest)-(TRAFFIC_CHART_DAYS-1)*DAY));
  const span=[];for(let d=from;d.toISOString().slice(0,10)<=latest;d=new Date(d.getTime()+DAY))span.push(d.toISOString().slice(0,10));
  const sum=(m,k)=>Object.values(t[m]).reduce((a,d)=>a+d[k],0);
  return panel(ph(h('span',{class:'c'},'read '+ago(t.fetchedAt))),
    t.status==='unavailable'?h('div',{class:'quiet'},'Traffic unavailable since the last read (the token needs Administration: Read). Showing what was collected before.'):null,
    h('div',{class:'tcharts'},trafficChart('Views',t.views,span,'view'),trafficChart('Clones',t.clones,span,'clone')),
    h('div',{class:'totals'},h('span',null,'Since '+first+':'),
      h('span',null,h('b',null,sum('views','count').toLocaleString()),' views'),
      h('span',null,h('b',null,sum('clones','count').toLocaleString()),' clones'),
      h('span',{class:'faint',title:'Someone who visits on two days counts twice'},'daily uniques summed: '+sum('views','uniques').toLocaleString()+' views · '+sum('clones','uniques').toLocaleString()+' clones')));
}
function trafficChart(label,byDay,span,unit){
  const vals=span.map(d=>byDay[d]),mx=Math.max(1,...vals.filter(Boolean).map(v=>v.count));
  const last14=span.slice(-14).reduce((a,d)=>a+(byDay[d]?byDay[d].count:0),0);
  return h('div',{class:'tchart'},
    h('div',{class:'hd'},h('span',{class:'k'},label),
      h('span',{class:'legend'},h('span',null,h('i',{class:'c-total'}),'Total'),h('span',null,h('i',{class:'c-unique'}),'Unique'))),
    h('div',{class:'tbars',role:'img','aria-label':label+' per day, '+span[0]+' to '+span[span.length-1]+'. '+last14+' in the last 14 days.'},
      span.map((d,i)=>{const v=vals[i];
        if(!v)return h('span',{class:'d unknown',title:d+': not tracked'},h('i',{style:'height:2px'}));
        const ht=n=>(n?Math.max(2,Math.round(n/mx*72)):0)+'px';
        return h('span',{class:'d',title:d+': '+plural(v.count,unit)+', '+v.uniques+' unique'},
          h('i',{class:'c-total',style:'height:'+ht(v.count)}),h('i',{class:'c-unique',style:'height:'+ht(v.uniques)}));
      })),
    h('div',{class:'axis'},h('span',null,span[0]),h('span',null,'peak '+mx+'/day'),h('span',null,span[span.length-1])));
}
function topList(p,kind){
  const t=p.traffic,title=kind==='referrers'?'Top referrers':'Popular pages';
  const items=(t&&t[kind])||[],origin=p.url.startsWith('http')?new URL(p.url).origin:'';
  return h('section',{class:'panel','aria-label':title},h('div',{class:'ph'},h('span',{class:'t'},title),h('span',{class:'c'},'14 days')),
    !p.trafficCollected||!t||!t.fetchedAt?h('div',{class:'none'},'No traffic data.')
    :items.length?h('ul',{class:'lines'},items.map(r=>h('li',null,
      kind==='referrers'?h('span',{class:'ell'},r.referrer)
        :h('a',{href:origin+r.path,target:'_blank',rel:'noopener',class:'ell',title:r.title},r.path.replace('/'+p.id,'')||'/'),
      h('span',{class:'n'},r.count,h('span',{class:'faint'},r.uniques+' unique')))))
    :h('div',{class:'none'},kind==='referrers'?'No referrers in the last 14 days.':'No page views in the last 14 days.'));
}
function releasesPanel(p){
  return h('section',{class:'panel','aria-label':'Releases'},
    h('div',{class:'ph'},h('span',{class:'t'},'Release downloads'),p.releaseCount?h('span',{class:'c'},p.downloads.toLocaleString()+' total'):null),
    p.releases.length?h('ul',{class:'lines'},p.releases.map(r=>h('li',null,
      h('a',{href:r.url,target:'_blank',rel:'noopener',class:'ell',title:r.name},r.tag),
      h('span',{class:'faint',style:'font-size:12px;white-space:nowrap'},isoDate(r.publishedAt)),
      h('span',{class:'n'},plural(r.downloads,'download'))))):h('div',{class:'none'},'No releases.'),
    p.releaseCount>p.releases.length?h('div',{class:'quiet'},'Counts the newest '+p.releases.length+' of '+p.releaseCount+' releases.'):null,
    p.releaseCount?h('div',{class:'quiet'},'Downloads of files attached to releases. Container image pulls aren\'t available from GitHub\'s API.'):null);
}
function stat(label,value,cls){return h('div',null,h('dt',null,label),h('dd',{class:cls||null},value));}

// ---------------------------------------------------------------- settings
let saving=false,saveMsg=null;
function settings(){
  document.title='Settings · Project yard';
  const list=[...DATA.projects].sort((a,b)=>a.id.localeCompare(b.id));
  const status=h('div',{class:'status',role:'status'},saveMsg?h('span',{class:saveMsg.err?'error':'muted'},saveMsg.text):null);
  const rows=list.map(p=>h('div',{class:'srow rule'+(p.hidden?' off':'')},
    h('div',{class:'nm'},h('span',null,p.name,p.private?h('span',{class:'faint',style:'font-size:11px;margin-left:8px'},'private'):null,
        p.archived?h('span',{class:'tag sm',style:'margin-left:8px'},'archived'):null),
      h('span',{class:'id'},p.id)),
    h('label',{class:'switch'},p.hidden?'Hidden':'Shown',
      h('input',{type:'checkbox',role:'switch',checked:!p.hidden,disabled:saving,'aria-label':'Show '+p.id+' on the board',
        onchange:e=>saveHidden(p.id,!e.target.checked)}))));
  return [h('div',{class:'settings'},h('a',{href:'#/',class:'back'},'← All projects'),
    h('h1',null,'Settings'),
    h('p',{class:'intro'},'Every repo the collector finds. Hidden repos drop off the board but stay listed here. New repos are shown. Repos that config.toml leaves out (its exclude list, plus archived repos and forks unless it includes them) never appear here.'),
    status,
    list.length?h('div',null,rows):h('div',{class:'none'},'No repos yet. They appear after the first refresh.'))];
}
async function saveHidden(id,hide){
  const hidden=new Set(DATA.projects.filter(p=>p.hidden).map(p=>p.id));
  hide?hidden.add(id):hidden.delete(id);
  saving=true;saveMsg=null;render();
  try{
    const r=await fetch('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:[...hidden]})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(body.error||('HTTP '+r.status));
    const saved=new Set(body.hidden.map(s=>s.toLowerCase()));
    for(const p of DATA.projects)p.hidden=saved.has(p.id.toLowerCase());
    saveMsg={text:(hide?'Hid ':'Showing ')+id+'.'};
  }catch(e){saveMsg={err:true,text:"Couldn't save: "+e.message};}
  saving=false;render();
}

// ---------------------------------------------------------------- routing + refresh
function render(){
  const hash=decodeURIComponent(location.hash),m=/^#\/(.+\/.+)$/.exec(hash);
  document.title='Project yard';
  const app=document.getElementById('app');
  app.replaceChildren(...(hash==='#/settings'?settings():m?detail(m[1]):COMPACT.matches?compact():overview()).filter(Boolean));
}
let lastRoute=location.hash;
addEventListener('hashchange',()=>{render();if(location.hash!==lastRoute)scrollTo(0,0);lastRoute=location.hash;});
COMPACT.addEventListener('change',render);
render();

// The server rewrites data.json every refresh; pick it up without reloading the page.
setInterval(async()=>{
  if(document.visibilityState!=='visible'||saving)return;
  try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){DATA=await r.json();render();}}catch{}
},5*60*1000);
</script>
